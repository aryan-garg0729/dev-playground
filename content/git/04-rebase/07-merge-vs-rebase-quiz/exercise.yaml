id: gt.rebasing.merge-vs-rebase-quiz
type: mcq
version: 1
title: Merge or Rebase?
xp: 5
difficulty: 2
tags: [rebase, merge]
spec:
  question: prompt.md
  multiple: true
  options:
    - { id: a, text: "Rebase your own unshared branch onto main to catch up" }
    - { id: b, text: "Rebase main onto your branch so main looks tidy" }
    - { id: c, text: "Merge a finished branch into main" }
    - { id: d, text: "Squash your wip commits with rebase -i before anyone reviews them" }
  answer: [a, c, d]
  explain: >
    Rebase is for your own history: catching your branch up with main, and cleaning up
    commits nobody else has. Merge is for bringing finished work into a shared branch,
    because it adds history instead of rewriting it. Rebasing main itself rewrites
    commits everybody already has, which breaks the golden rule.
