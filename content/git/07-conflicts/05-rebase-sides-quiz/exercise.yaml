id: gt.resolving.rebase-sides-quiz
type: mcq
version: 1
title: The Flip
xp: 5
difficulty: 3
tags: [conflicts, rebase]
spec:
  question: prompt.md
  multiple: false
  options:
    - { id: a, text: "--ours, because it's your branch" }
    - { id: b, text: "--theirs, because during a rebase your commit being replayed is \"theirs\"" }
    - { id: c, text: "--ours, because ours always means the commit you wrote" }
    - { id: d, text: "Neither works during a rebase" }
  answer: [b]
  explain: >
    A rebase starts from main and applies your commits on top of it one by one. So HEAD
    ("ours") is main plus whatever has been replayed so far, and "theirs" is your commit
    being applied. That's the reverse of a merge on main. Read the marker labels instead of
    trusting memory: during a rebase, the >>>>>>> line names your commit.
