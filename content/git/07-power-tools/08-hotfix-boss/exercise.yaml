id: gt.tools.hotfix-boss
type: project_cli
version: 1
title: Hotfix v1.0.1
xp: 75
difficulty: 5
tags: [worktree, tags, merge]
boss: true
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: The hotfix worktree was removed properly
      cli_command:
        command: "echo worktrees=$(git worktree list | wc -l | tr -d ' '); test -e ../handbook-hotfix && echo folder=still-there || echo folder=gone"
        tests:
          - stdout_contains_all: ["worktrees=1\n", "folder=gone"]
    - description: Find the v1.0.0 commit
      cli_command:
        command: "git rev-parse 'v1.0.0^{commit}'"
        captures: [{ name: v100, regex: "([0-9a-f]{40})" }]
        tests:
          - exit_code: 0
    - description: E7 on hotfix/v1.0.1 was built on v1.0.0
      cli_command:
        command: "git log -1 --format='%H %s parents=%P' hotfix/v1.0.1"
        captures: [{ name: e7, regex: "^([0-9a-f]{40})" }]
        tests:
          - exit_code: 0
          - stdout_contains_all: ["E7:", "parents=${v100}\n"]
    - description: v1.0.1 is an annotated tag on E7
      cli_command:
        command: "echo type=$(git cat-file -t v1.0.1); git rev-parse 'v1.0.1^{commit}'"
        tests:
          - stdout_contains_all: ["type=tag\n", "${e7}"]
    - description: F7 is a real merge of v1.0.0 and E7 at the tip of main
      cli_command:
        command: "git log -1 --format='%s parents=%P' main"
        tests:
          - stdout_contains_all: ["F7:", "${v100}", "${e7}"]
    - description: main has the corrected extension
      cli_command:
        command: "git show main:contacts.md"
        tests:
          - stdout_contains_all: ["Brewing floor: ext. 4401"]
          - stdout_contains_none: ["4410"]
