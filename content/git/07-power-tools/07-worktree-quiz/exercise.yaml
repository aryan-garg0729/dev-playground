id: gt.tools.worktree-quiz
type: mcq
version: 1
title: Two Branches at Once
xp: 5
difficulty: 3
tags: [worktree]
spec:
  question: prompt.md
  multiple: false
  options:
    - { id: a, text: "A second clone, with its own copy of every commit" }
    - { id: b, text: "A second working directory that shares the same repository, checked out on a different branch" }
    - { id: c, text: "A stash you can open in another folder" }
    - { id: d, text: "A read-only snapshot of a tag" }
  answer: [b]
  explain: >
    git worktree add gives one repository a second working tree. Both folders share the
    same objects, branches and tags, so a commit made in one is visible in the other at
    once, with no push or fetch. Each worktree has its own checked-out branch, and Git
    won't let two worktrees check out the same branch. Remove it with git worktree remove,
    so Git also forgets it; deleting the folder by hand leaves stale bookkeeping behind.
