id: gt.tools.stash
type: project_cli
version: 1
title: The Pager Goes Off
xp: 25
difficulty: 3
tags: [stash]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: The stash is empty again
      cli_command:
        command: "echo \"stashes=$(git stash list | wc -l | tr -d ' ')\""
        tests:
          - stdout_contains_all: ["stashes=0\n"]
    - description: Find the A7 hotfix
      cli_command:
        command: "git log -1 --format=%H ':/^A7:'"
        captures: [{ name: a7, regex: "([0-9a-f]{40})" }]
        tests:
          - exit_code: 0
    - description: B7 sits on A7 at the tip of main
      cli_command:
        command: "git log -1 --format='%s parents=%P' main"
        tests:
          - stdout_contains_all: ["B7:", "parents=${a7}\n"]
    - description: The hotfix is in the playbook
      cli_command:
        command: "git show main:playbook.md"
        tests:
          - stdout_contains_all: ["every 15 minutes"]
    - description: The status page has the lines from before and after the interruption
      cli_command:
        command: "git show main:status.md"
        tests:
          - stdout_contains_all: ["Status page: status.elixirbytes.shop", "Update it within 10 minutes of a SEV1."]
