id: gt.tools.cherry-pick
type: project_cli
version: 1
title: Right Fix, Wrong Branch
xp: 25
difficulty: 3
tags: [cherry-pick]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: There are two D7 commits, the original and the copy
      cli_command:
        command: "echo \"d7_commits=$(git log --all --format=%s | grep -c '^D7:')\""
        tests:
          - stdout_contains_all: ["d7_commits=2\n"]
    - description: main's tip is a D7, and C7 is not on main
      cli_command:
        command: "git --no-pager log --format=%s -n 5 main"
        tests:
          - stdout_contains_all: ["D7:"]
          - stdout_contains_none: ["C7:"]
    - description: feat/metrics is still there with C7 and D7
      cli_command:
        command: "git --no-pager log --format=%s -n 2 feat/metrics"
        tests:
          - exit_code: 0
          - stdout_contains_all: ["D7:", "C7:"]
    - description: main has the 15-minute escalation window
      cli_command:
        command: "git show main:oncall.md"
        tests:
          - stdout_contains_all: ["Escalation window: 15 minutes"]
