id: gt.basics.init
type: project_cli
version: 1
title: Your First Repository
xp: 15
difficulty: 1
tags: [init]
free: true
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: The project folder is the top of its own repository
      cli_command:
        command: "test \"$(git rev-parse --show-toplevel)\" = \"$(pwd -P)\" && echo root=here || echo root=elsewhere"
        tests:
          - exit_code: 0
          - stdout_contains_all: ["root=here"]
    - description: The first branch is called main
      cli_command:
        command: git symbolic-ref --short HEAD
        tests:
          - exit_code: 0
          - stdout_contains_all: ["main"]
          - stdout_contains_none: ["master"]
