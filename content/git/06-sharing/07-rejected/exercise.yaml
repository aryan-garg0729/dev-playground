id: gt.sharing.rejected
type: project_cli
version: 1
title: Push Rejected
xp: 25
difficulty: 3
tags: [push, pull, rebase]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: Find the teammate's B6 on the remote
      cli_command:
        command: "git --git-dir=../project-origin.git log -1 --format=%H ':/^B6:'"
        captures: [{ name: b6, regex: "([0-9a-f]{40})" }]
        tests:
          - exit_code: 0
    - description: Your C6 was rebased onto B6 and pushed
      cli_command:
        command: "git --git-dir=../project-origin.git log -1 --format='%s parents=%P' main"
        tests:
          - stdout_contains_all: ["C6:", "parents=${b6}"]
    - description: The teammate's line and your link both made it
      cli_command:
        command: "git --git-dir=../project-origin.git show main:guestbook.md main:index.md"
        tests:
          - stdout_contains_all: ["Nice site!", "[Guestbook](guestbook.md)"]
    - description: Your main and origin/main agree
      cli_command:
        command: git status -sb
        tests:
          - stdout_contains_all: ["## main...origin/main\n"]
