id: gt.sharing.clone
type: project_cli
version: 1
title: A Teammate Joins
xp: 25
difficulty: 2
tags: [clone, push]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: The teammate's clone commits as the teammate
      cli_command:
        command: git -C ../teammate config --local --get user.email
        tests:
          - exit_code: 0
          - stdout_contains_all: ["teammate@example.com"]
    - description: The teammate's clone came from the shared remote
      cli_command:
        command: git -C ../teammate remote get-url origin
        tests:
          - exit_code: 0
          - stdout_contains_all: ["project-origin.git"]
    - description: The teammate pushed A6 to the remote
      cli_command:
        command: "git --git-dir=../project-origin.git log -1 --format='%s by %ae' main"
        tests:
          - exit_code: 0
          - stdout_contains_all: ["A6:", "by teammate@example.com"]
