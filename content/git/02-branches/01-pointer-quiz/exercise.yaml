id: gt.branches.pointer-quiz
type: mcq
version: 1
title: A Branch Is a Sticky Note
xp: 5
difficulty: 1
tags: [branches]
free: true
spec:
  question: prompt.md
  multiple: false
  options:
    - { id: a, text: "A full copy of every file, so it gets slower as the repo grows" }
    - { id: b, text: "A copy of every commit on main" }
    - { id: c, text: "One small file holding a commit hash, so it costs almost nothing" }
    - { id: d, text: "A separate .git folder" }
  answer: [c]
  explain: >
    A branch is a file in .git/refs/heads whose content is one commit hash. Creating a
    branch writes 41 bytes, whatever the size of the repo. When you commit on a branch, Git
    makes the new commit and moves that pointer to it. Nothing is copied: the commits and
    their trees are shared by every branch that can reach them.
