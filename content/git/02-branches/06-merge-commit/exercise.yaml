id: gt.branches.merge-commit
type: project_cli
version: 1
title: When Both Sides Moved
xp: 25
difficulty: 2
tags: [merge]
free: true
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: Find B2 (the price list, on add-prices)
      cli_command:
        command: "git log -1 --format=%H ':/^B2:'"
        captures: [{ name: b2, regex: "([0-9a-f]{40})" }]
        tests:
          - exit_code: 0
    - description: Find C2 (the menu link, on main)
      cli_command:
        command: "git log -1 --format=%H ':/^C2:'"
        captures: [{ name: c2, regex: "([0-9a-f]{40})" }]
        tests:
          - exit_code: 0
    - description: D2 is a merge commit with C2 and B2 as its parents
      cli_command:
        command: "git log -1 --format='parents=%P' ':/^D2:'"
        tests:
          - exit_code: 0
          - stdout_contains_all: ["${c2}", "${b2}"]
    - description: main is at D2 and has both changes
      cli_command:
        command: "git log -1 --format=%s main; git ls-tree --name-only main; git show main:index.md"
        tests:
          - stdout_contains_all: ["D2:", "prices.md", "menu.md", "[Menu](menu.md)"]
