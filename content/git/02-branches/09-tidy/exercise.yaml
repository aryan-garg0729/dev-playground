id: gt.branches.tidy
type: project_cli
version: 1
title: Tidy Up Branches
xp: 15
difficulty: 1
tags: [branches]
free: true
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: The merged branches are gone and recipes was renamed
      cli_command:
        command: git branch --no-color
        tests:
          - exit_code: 0
          - stdout_contains_all: ["* main", "recipes/potions", "experiment/old-index"]
          - stdout_contains_none: ["add-menu", "add-prices", "recipes\n"]
    - description: Your work is still on main
      cli_command:
        command: "git --no-pager log --format=%s main"
        tests:
          - stdout_contains_all: ["A2:", "B2:", "D2:"]
