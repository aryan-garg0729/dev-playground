id: gt.branches.specials-boss
type: project_cli
version: 1
title: Specials Menu Launch
xp: 50
difficulty: 2
tags: [branches, merge]
free: true
boss: true
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: Find G2 (the last commit of the specials branch)
      cli_command:
        command: "git log -1 --format=%H ':/^G2:'"
        captures: [{ name: g2, regex: "([0-9a-f]{40})" }]
        tests:
          - exit_code: 0
    - description: Find H2 (the CONTRIBUTING change on main)
      cli_command:
        command: "git log -1 --format=%H ':/^H2:'"
        captures: [{ name: h2, regex: "([0-9a-f]{40})" }]
        tests:
          - exit_code: 0
    - description: G2 sits directly on F2
      cli_command:
        command: "git --no-pager log --format=%s -n 2 ${g2}"
        tests:
          - stdout_contains_all: ["F2:"]
    - description: I2 merges H2 and G2
      cli_command:
        command: "git log -1 --format='parents=%P' ':/^I2:'"
        tests:
          - stdout_contains_all: ["${h2}", "${g2}"]
    - description: main is at I2 with the specials page
      cli_command:
        command: "git log -1 --format=%s main; git ls-tree --name-only main"
        tests:
          - stdout_contains_all: ["I2:", "specials.md"]
    - description: launch/specials was deleted and you're on main
      cli_command:
        command: git branch --no-color
        tests:
          - stdout_contains_all: ["* main"]
          - stdout_contains_none: ["launch/specials"]
    - description: The working tree is clean
      cli_command:
        command: "git status --short; test -z \"$(git status --porcelain)\""
        tests:
          - exit_code: 0
