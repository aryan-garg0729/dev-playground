id: gt.branches.graph-quiz
type: mcq
version: 1
title: Reading the Graph
xp: 5
difficulty: 2
tags: [log, merge]
free: true
spec:
  question: prompt.md
  multiple: false
  options:
    - { id: a, text: "3e9b7d2: it's on top, so it's the merge" }
    - { id: b, text: "6d14c0a: it has two parent hashes, 51ab3f9 and 2c7e880" }
    - { id: c, text: "51ab3f9: it's where the line splits" }
    - { id: d, text: "None: merges don't show up in git log" }
  answer: [b]
  explain: >
    With --parents, every hash after the first on a line is a parent. 6d14c0a lists two,
    51ab3f9 (C2 on main) and 2c7e880 (B2 on the branch), so it's the merge commit. The |\
    and |/ in the graph are where history splits and joins. The top commit is simply the
    newest; being on top says nothing about how many parents it has.
