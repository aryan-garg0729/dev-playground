id: gt.branches.switch
type: project_cli
version: 1
title: Work on a Branch
xp: 20
difficulty: 1
tags: [branches, switch]
free: true
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: You're on add-menu
      cli_command:
        command: git branch --show-current
        tests:
          - exit_code: 0
          - stdout_contains_all: ["add-menu"]
    - description: Find main's commit
      cli_command:
        command: git rev-parse main
        captures: [{ name: main, regex: "([0-9a-f]{40})" }]
        tests:
          - exit_code: 0
    - description: A2 was committed on top of main's commit
      cli_command:
        command: "git log -1 --format='parents=%P' add-menu"
        tests:
          - exit_code: 0
          - stdout_contains_all: ["parents=${main}"]
    - description: A2 is on add-menu and menu.md is in it
      cli_command:
        command: "git log -1 --format=%s add-menu; git ls-tree --name-only add-menu"
        tests:
          - stdout_contains_all: ["A2:", "menu.md"]
    - description: main hasn't moved
      cli_command:
        command: "git --no-pager log --format=%s main"
        tests:
          - exit_code: 0
          - stdout_contains_none: ["A2:"]
