id: gt.rebase.new-hashes-quiz
type: mcq
version: 1
title: Replayed, Not Moved
xp: 5
difficulty: 2
tags: [rebase]
spec:
  question: prompt.md
  multiple: false
  options:
    - { id: a, text: "Yes: rebase moves the same commits, so the hash stays" }
    - { id: b, text: "No: the copy has a new parent, and the parent is part of what gets hashed" }
    - { id: c, text: "No, but only because the date changes" }
    - { id: d, text: "It depends on whether there were conflicts" }
  answer: [b]
  explain: >
    A commit's hash covers its tree, author, message and its parent. Rebase makes new
    commits with the same changes on top of a different parent, so every replayed commit
    gets a new hash, conflicts or not. The originals still exist for a while (the reflog
    remembers them), but your branch now points at the copies. That's the whole reason
    rebasing shared commits causes trouble.
