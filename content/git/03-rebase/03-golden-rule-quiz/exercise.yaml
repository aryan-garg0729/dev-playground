id: gt.rebase.golden-rule-quiz
type: mcq
version: 1
title: The Golden Rule
xp: 5
difficulty: 2
tags: [rebase]
spec:
  question: prompt.md
  multiple: false
  options:
    - { id: a, text: "Nothing: Git notices the commits have the same changes and skips them" }
    - { id: b, text: "Dex's main and yours now disagree; his work sits on commits that no longer exist on yours, and pulling makes duplicates or a mess" }
    - { id: c, text: "Git refuses to rebase main" }
    - { id: d, text: "Dex's clone is updated automatically" }
  answer: [b]
  explain: >
    Rebase replaces commits with new ones (new hashes). Anyone who already has the old
    commits now has a different history from yours, and their next pull tries to combine
    the old and new copies. Hence the golden rule: never rebase commits other people
    already have. Rebasing your own unpublished branch is safe and normal. Git won't stop
    you rebasing main; it's a team rule, not a technical one.
