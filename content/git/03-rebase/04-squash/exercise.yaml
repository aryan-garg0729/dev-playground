id: gt.rebase.squash
type: project_cli
version: 1
title: Squash the Mess
xp: 30
difficulty: 3
tags: [rebase, squash]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: Exactly one C3 commit exists
      cli_command:
        command: "echo \"c3_commits=$(git log --all --format=%s | grep -c '^C3:')\""
        tests:
          - stdout_contains_all: ["c3_commits=1\n"]
    - description: No wip commit survives on any branch
      cli_command:
        command: "git --no-pager log --all --format=%s"
        tests:
          - exit_code: 0
          - stdout_contains_none: ["wip"]
    - description: Find B3
      cli_command:
        command: "git log -1 --format=%H ':/^B3:'"
        captures: [{ name: b3, regex: "([0-9a-f]{40})" }]
        tests:
          - exit_code: 0
    - description: C3 sits on B3 and is main's tip
      cli_command:
        command: "git log -1 --format='%s parents=%P' main"
        tests:
          - stdout_contains_all: ["C3:", "parents=${b3}"]
    - description: The playbook at C3 has all three sections
      cli_command:
        command: "git show main:playbook.md"
        tests:
          - stdout_contains_all: ["## Triage", "## Mitigate", "## Comms"]
