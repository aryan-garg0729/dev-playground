id: gt.undo.restore-source
type: project_cli
version: 1
title: Bring Back an Old Version
xp: 25
difficulty: 2
tags: [restore]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: Find the commit before B4
      cli_command:
        command: "git log -1 --format='parents=%P' ':/^B4:'"
        captures: [{ name: before, regex: "parents=([0-9a-f]{40})" }]
        tests:
          - exit_code: 0
    - description: Look up the runbook as it was before B4
      cli_command:
        command: "git rev-parse ${before}:runbooks/deploy.md"
        captures: [{ name: good, regex: "([0-9a-f]{40})" }]
        tests:
          - exit_code: 0
    - description: C4's runbook is exactly that version
      cli_command:
        command: "git log -1 --format=%H ':/^C4:' | xargs -I{} git rev-parse {}:runbooks/deploy.md"
        tests:
          - stdout_contains_all: ["${good}"]
    - description: B4 is still in history, with C4 after it on main
      cli_command:
        command: "git --no-pager log --format=%s -n 2 main"
        tests:
          - stdout_contains_all: ["C4:", "B4:"]
    - description: The working tree is clean
      cli_command:
        command: "git status --short; test -z \"$(git status --porcelain)\""
        tests:
          - exit_code: 0
