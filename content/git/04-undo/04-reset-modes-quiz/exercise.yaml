id: gt.undo.reset-modes-quiz
type: mcq
version: 1
title: Soft, Mixed, Hard
xp: 5
difficulty: 2
tags: [reset]
spec:
  question: prompt.md
  multiple: false
  options:
    - { id: a, text: "--soft: the commit is undone and its changes are still staged" }
    - { id: b, text: "--mixed: the commit is undone and its changes are unstaged, still in your files" }
    - { id: c, text: "--hard: the commit is undone and its changes are gone from your files" }
    - { id: d, text: "Any of them: they only differ in speed" }
  answer: [c]
  explain: >
    Only --hard rewrites your working tree to match the target commit, which throws away
    the changes in your files (and any uncommitted edits you had). --soft moves only the
    branch, so the changes stay staged. --mixed, the default, moves the branch and resets
    the staging area, so the changes are still in your files but unstaged. The commit
    itself isn't destroyed by any of them, as the reflog lessons show.
