id: gt.undo.reflog-limits-quiz
type: mcq
version: 1
title: What the Reflog Can't Save
xp: 5
difficulty: 2
tags: [reflog]
spec:
  question: prompt.md
  multiple: true
  options:
    - { id: a, text: "A commit you made, then lost with git reset --hard" }
    - { id: b, text: "Edits you never committed, thrown away by git reset --hard" }
    - { id: c, text: "A commit you made on a branch you then deleted with -D" }
    - { id: d, text: "Commits Dex lost in his own clone, from your clone's reflog" }
  answer: [b, d]
  explain: >
    The reflog records where HEAD pointed, so it can only bring back commits. Uncommitted
    edits were never commits, so a hard reset destroys them for real. And the reflog is
    local: it lives in .git/logs of one clone and is never pushed, so your reflog knows
    nothing about Dex's. Lost commits in your own clone (a and c) are recoverable, until
    their entries expire (about 90 days, or 30 for unreachable ones) and git gc cleans up.
