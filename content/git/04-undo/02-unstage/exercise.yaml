id: gt.undo.unstage
type: project_cli
version: 1
title: Unstage a Secret
xp: 20
difficulty: 2
tags: [restore, staging]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: A4 changes CONTRIBUTING.md and nothing else
      cli_command:
        command: "git show --name-only --format=%s ':/^A4:'"
        tests:
          - exit_code: 0
          - stdout_contains_all: ["A4:", "CONTRIBUTING.md"]
          - stdout_contains_none: ["secrets.txt"]
    - description: No commit on any branch has ever contained secrets.txt
      cli_command:
        command: "echo \"secret_commits=$(git log --all --oneline -- secrets.txt | wc -l | tr -d ' ')\""
        tests:
          - stdout_contains_all: ["secret_commits=0\n"]
    - description: secrets.txt is deleted and nothing is left over
      cli_command:
        command: "git status --short; test ! -e secrets.txt && test -z \"$(git status --porcelain)\""
        tests:
          - exit_code: 0
