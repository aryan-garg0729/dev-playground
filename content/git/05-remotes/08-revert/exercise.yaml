id: gt.remotes.revert
type: project_cli
version: 1
title: You Published Something Wrong
xp: 30
difficulty: 3
tags: [revert, push]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: The remote's main still has D5, and a revert of it on top
      cli_command:
        command: "git --git-dir=../handbook-origin.git log --format=%s -n 2 main"
        tests:
          - exit_code: 0
          - stdout_contains_all: ['Revert "D5:', "D5:"]
    - description: pricing.md is gone from the remote's main
      cli_command:
        command: git --git-dir=../handbook-origin.git ls-tree --name-only main
        tests:
          - exit_code: 0
          - stdout_contains_none: ["pricing.md"]
    - description: Your main and origin/main agree
      cli_command:
        command: git status -sb
        tests:
          - stdout_contains_all: ["## main...origin/main\n"]
