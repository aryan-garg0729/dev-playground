id: gt.remotes.force-lease-quiz
type: mcq
version: 1
title: Force, Carefully
xp: 5
difficulty: 3
tags: [push, rebase]
spec:
  question: prompt.md
  multiple: false
  options:
    - { id: a, text: "--force: it always works" }
    - { id: b, text: "--force-with-lease: it overwrites only if the remote branch is still where you last saw it" }
    - { id: c, text: "Neither: delete the remote branch and push again" }
    - { id: d, text: "--force-with-lease, because it merges Dex's commit in for you" }
  answer: [b]
  explain: >
    Both flags let a push replace the remote branch instead of fast-forwarding it.
    --force does it blindly, so if Dex pushed a fix to your branch since your last fetch,
    it's silently gone. --force-with-lease first checks that the remote branch still points
    where your origin/feature says it was, and refuses if someone moved it. It doesn't merge
    anything; it just refuses to destroy work you haven't seen.
