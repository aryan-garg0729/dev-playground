id: gt.remotes.clone
type: project_cli
version: 1
title: Dex Gets a Copy
xp: 25
difficulty: 2
tags: [remotes, clone, push]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: Dex's clone commits as Dex
      cli_command:
        command: git -C ../dex-handbook config --local --get user.email
        tests:
          - exit_code: 0
          - stdout_contains_all: ["dex@elixirbytes.shop"]
    - description: Dex's clone came from the shared remote
      cli_command:
        command: git -C ../dex-handbook remote get-url origin
        tests:
          - exit_code: 0
          - stdout_contains_all: ["handbook-origin.git"]
    - description: Dex pushed A5 to the remote
      cli_command:
        command: "git --git-dir=../handbook-origin.git log -1 --format='%s by %ae' main"
        tests:
          - exit_code: 0
          - stdout_contains_all: ["A5:", "by dex@elixirbytes.shop"]
