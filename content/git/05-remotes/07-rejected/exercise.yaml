id: gt.remotes.rejected
type: project_cli
version: 1
title: Push Rejected
xp: 30
difficulty: 3
tags: [remotes, push, rebase]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: Find Dex's B5 on the remote
      cli_command:
        command: "git --git-dir=../handbook-origin.git log -1 --format=%H ':/^B5:'"
        captures: [{ name: b5, regex: "([0-9a-f]{40})" }]
        tests:
          - exit_code: 0
    - description: Your C5 was rebased onto B5 and pushed
      cli_command:
        command: "git --git-dir=../handbook-origin.git log -1 --format='%s parents=%P' main"
        tests:
          - stdout_contains_all: ["C5:", "parents=${b5}"]
    - description: Dex's contact and your link both made it
      cli_command:
        command: "git --git-dir=../handbook-origin.git show main:contacts.md main:index.md"
        tests:
          - stdout_contains_all: ["Night shift: Dex", "[Contacts](contacts.md)"]
    - description: Your main and origin/main agree
      cli_command:
        command: git status -sb
        tests:
          - stdout_contains_all: ["## main...origin/main\n"]
