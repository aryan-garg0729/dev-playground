id: gt.remotes.sync-boss
type: project_cli
version: 1
title: The Discount Code Leak
xp: 60
difficulty: 4
tags: [remotes, push, rebase, revert]
boss: true
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: docs/faq is on the remote with H5
      cli_command:
        command: "git --git-dir=../handbook-origin.git log -1 --format=%s docs/faq"
        tests:
          - exit_code: 0
          - stdout_contains_all: ["H5:"]
    - description: Your docs/faq tracks origin/docs/faq
      cli_command:
        command: "git rev-parse --abbrev-ref docs/faq@{upstream}"
        tests:
          - stdout_contains_all: ["origin/docs/faq"]
    - description: Find Mo's G5 on the remote
      cli_command:
        command: "git --git-dir=../handbook-origin.git log -1 --format=%H ':/^G5:'"
        captures: [{ name: g5, regex: "([0-9a-f]{40})" }]
        tests:
          - exit_code: 0
    - description: Your I5 sits on G5, with no merge commit
      cli_command:
        command: "git --git-dir=../handbook-origin.git log -1 --format='parents=%P' ':/^I5:'"
        tests:
          - stdout_contains_all: ["parents=${g5}\n"]
    - description: The remote's main ends with the revert of G5, and G5 is still in history
      cli_command:
        command: "git --git-dir=../handbook-origin.git log --format=%s -n 3 main"
        tests:
          - stdout_contains_all: ['Revert "G5:', "I5:", "G5:"]
    - description: codes.md is gone from the remote's main
      cli_command:
        command: git --git-dir=../handbook-origin.git ls-tree --name-only main
        tests:
          - stdout_contains_none: ["codes.md"]
    - description: Your main and origin/main agree
      cli_command:
        command: git status -sb
        tests:
          - stdout_contains_all: ["## main...origin/main\n"]
