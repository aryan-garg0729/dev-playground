id: gt.remotes.tracking-quiz
type: mcq
version: 1
title: What Is origin/main?
xp: 5
difficulty: 2
tags: [remotes]
spec:
  question: prompt.md
  multiple: false
  options:
    - { id: a, text: "A live view of the server's main, always up to date" }
    - { id: b, text: "Your repo's memory of where the server's main was the last time you talked to it" }
    - { id: c, text: "A branch you can commit on directly" }
    - { id: d, text: "Another name for your local main" }
  answer: [b]
  explain: >
    origin/main is a remote-tracking branch: a bookmark Git updates only when you talk to
    the server (fetch, pull, push). Between those, the server can move and origin/main won't
    know. You can't commit on it; switching to it gives you a detached HEAD. And it isn't
    your main: the two differ whenever you have commits you haven't pushed, or the server
    has commits you haven't pulled.
