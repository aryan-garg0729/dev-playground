id: gt.repos.identity
type: project_cli
version: 1
title: Commit as an ElixirBytes Dev
xp: 15
difficulty: 1
tags: [config]
free: true
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: The repo has its own work email
      cli_command:
        command: git config --local --get user.email
        tests:
          - exit_code: 0
          - stdout_contains_all: ["@elixirbytes.shop"]
    - description: The repo has its own name set
      cli_command:
        command: git config --local --get user.name
        tests:
          - exit_code: 0
    - description: The email Git will actually use comes from .git/config
      cli_command:
        command: git config --show-origin --get user.email
        tests:
          - exit_code: 0
          - stdout_contains_all: ["file:.git/config", "@elixirbytes.shop"]
