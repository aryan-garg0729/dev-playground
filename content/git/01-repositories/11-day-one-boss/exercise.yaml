id: gt.repos.day-one-boss
type: project_cli
version: 1
title: Handbook Day One
xp: 50
difficulty: 2
tags: [commit, gitignore, internals]
free: true
boss: true
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: Find commit B1
      cli_command:
        command: "git log -1 --format=%H ':/^B1:'"
        captures: [{ name: b1, regex: "([0-9a-f]{40})" }]
        tests:
          - exit_code: 0
    - description: C1 sits on B1 and was made with your work email
      cli_command:
        command: "git log -1 --format='parents=%P author=%ae' ':/^C1:'"
        tests:
          - stdout_contains_all: ["parents=${b1}", "@elixirbytes.shop"]
    - description: C1 adds CONTRIBUTING.md and no drafts
      cli_command:
        command: "git ls-tree -r --name-only ':/^C1:'"
        tests:
          - stdout_contains_all: ["CONTRIBUTING.md"]
          - stdout_contains_none: [".draft"]
    - description: Draft files are ignored
      cli_command:
        command: git check-ignore -v specials.draft
        tests:
          - exit_code: 0
    - description: Look up C1's tree
      cli_command:
        command: "git log -1 --format=tree=%T ':/^C1:'"
        captures: [{ name: tree, regex: "tree=([0-9a-f]{40})" }]
        tests:
          - exit_code: 0
    - description: answers.txt records C1's tree hash
      cli_command:
        command: "grep -x 'c1_tree=${tree}' answers.txt"
        tests:
          - exit_code: 0
    - description: The working tree is clean
      cli_command:
        command: "git status --short; test -z \"$(git status --porcelain)\""
        tests:
          - exit_code: 0
