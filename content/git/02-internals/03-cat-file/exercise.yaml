id: gt.internals.cat-file
type: project_cli
version: 1
title: Look Inside a Commit
xp: 20
difficulty: 2
tags: [internals, plumbing]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: Look up A2's tree
      cli_command:
        command: "git log -1 --format=tree=%T ':/^A2:'"
        captures: [{ name: tree, regex: "tree=([0-9a-f]{40})" }]
        tests:
          - exit_code: 0
    - description: answers.txt records A2's tree id
      cli_command:
        command: "grep -x 'a2_tree=${tree}' answers.txt"
        tests:
          - exit_code: 0
    - description: Look up A2's parent
      cli_command:
        command: "git log -1 --format=parent=%P ':/^A2:'"
        captures: [{ name: parent, regex: "parent=([0-9a-f]{40})" }]
        tests:
          - exit_code: 0
    - description: answers.txt records A2's parent id
      cli_command:
        command: "grep -x 'a2_parent=${parent}' answers.txt"
        tests:
          - exit_code: 0
