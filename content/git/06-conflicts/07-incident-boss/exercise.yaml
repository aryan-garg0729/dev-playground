id: gt.conflicts.incident-boss
type: project_cli
version: 1
title: Incident Review Template
xp: 60
difficulty: 4
tags: [conflicts, rebase, squash, merge]
boss: true
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: Find H6 (the new pager number on main)
      cli_command:
        command: "git log -1 --format=%H ':/^H6:'"
        captures: [{ name: h6, regex: "([0-9a-f]{40})" }]
        tests:
          - exit_code: 0
    - description: Exactly one I6, and no wip on any branch
      cli_command:
        command: "echo \"i6_commits=$(git log --all --format=%s | grep -c '^I6:')\"; git --no-pager log --all --format=%s"
        tests:
          - stdout_contains_all: ["i6_commits=1\n"]
          - stdout_contains_none: ["wip"]
    - description: I6 was squashed first, then rebased onto H6
      cli_command:
        command: "git log -1 --format='%H parents=%P' ':/^I6:'"
        captures: [{ name: i6, regex: "^([0-9a-f]{40})" }]
        tests:
          - stdout_contains_all: ["parents=${h6}\n"]
    - description: J6 is a real merge of H6 and I6 at the tip of main
      cli_command:
        command: "git log -1 --format='%s parents=%P' main"
        tests:
          - stdout_contains_all: ["J6:", "${h6}", "${i6}"]
    - description: The pager line keeps both sides, with no markers
      cli_command:
        command: "git show main:oncall.md"
        tests:
          - stdout_contains_all: ["Primary pager: +1-555-0199, Pagerly rota platform\n"]
          - stdout_contains_none: ["<<<<<<<", "0142"]
    - description: The incident template has both sections
      cli_command:
        command: "git show main:incidents.md"
        tests:
          - stdout_contains_all: ["# Incident review", "## Timeline"]
