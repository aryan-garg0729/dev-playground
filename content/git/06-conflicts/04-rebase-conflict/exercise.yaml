id: gt.conflicts.rebase-conflict
type: project_cli
version: 1
title: One Conflict per Commit
xp: 35
difficulty: 4
tags: [conflicts, rebase]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: Find F6 (main's change)
      cli_command:
        command: "git log -1 --format=%H ':/^F6:'"
        captures: [{ name: f6, regex: "([0-9a-f]{40})" }]
        tests:
          - exit_code: 0
    - description: Find D6
      cli_command:
        command: "git log -1 --format='%H parents=%P' ':/^D6:'"
        captures: [{ name: d6, regex: "^([0-9a-f]{40})" }]
        tests:
          - stdout_contains_all: ["parents=${f6}\n"]
    - description: D6 keeps the first resolution
      cli_command:
        command: "git show ${d6}:runbooks/deploy.md | grep '^3\\.'"
        tests:
          - stdout_contains_all: ["3. Watch error rate and p99 latency for 20 minutes\n"]
    - description: E6 sits on D6 at the tip of main
      cli_command:
        command: "git log -1 --format='%s parents=%P' main"
        tests:
          - stdout_contains_all: ["E6:", "parents=${d6}\n"]
    - description: E6 keeps the second resolution and no markers anywhere
      cli_command:
        command: "git show main:runbooks/deploy.md"
        tests:
          - stdout_contains_all: ["3. Watch error rate and p99 latency for 20 minutes (page if it exceeds 2%)\n"]
          - stdout_contains_none: ["<<<<<<<", ">>>>>>>"]
