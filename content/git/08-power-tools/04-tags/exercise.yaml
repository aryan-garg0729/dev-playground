id: gt.toolbox.tags
type: project_cli
version: 1
title: Tag a Release
xp: 20
difficulty: 2
tags: [tags]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: Find main's tip
      cli_command:
        command: git rev-parse main
        captures: [{ name: main, regex: "([0-9a-f]{40})" }]
        tests:
          - exit_code: 0
    - description: v1.0.0 is an annotated tag on main's tip
      cli_command:
        command: "echo type=$(git cat-file -t v1.0.0); git rev-parse 'v1.0.0^{commit}'"
        tests:
          - stdout_contains_all: ["type=tag\n", "${main}"]
    - description: v0.9.0 is an annotated tag on C4
      cli_command:
        command: "echo type=$(git cat-file -t v0.9.0); git log -1 --format=%s v0.9.0"
        tests:
          - stdout_contains_all: ["type=tag\n", "C4:"]
    - description: today is a lightweight tag on the A8 fix
      cli_command:
        command: "echo type=$(git cat-file -t today); git log -1 --format=%s today"
        tests:
          - stdout_contains_all: ["type=commit\n", "A8:"]
