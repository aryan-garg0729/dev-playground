id: gt.toolbox.describe
type: project_cli
version: 1
title: Which Version Is This?
xp: 20
difficulty: 2
tags: [tags, describe]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: Find A5
      cli_command:
        command: "git log -1 --format=%H ':/^A5:'"
        captures: [{ name: a5, regex: "([0-9a-f]{40})" }]
        tests:
          - exit_code: 0
    - description: Ask Git to describe A5
      cli_command:
        command: "git describe ${a5}"
        captures: [{ name: desc, regex: "(\\S+)" }]
        tests:
          - exit_code: 0
          - stdout_contains_all: ["v0.9.0-"]
    - description: answers.txt records exactly that description
      cli_command:
        command: "grep -x 'describe=${desc}' answers.txt"
        tests:
          - exit_code: 0
