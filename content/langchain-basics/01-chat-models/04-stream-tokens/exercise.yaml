id: lc.chat.stream-tokens
type: code
version: 1
title: Stream a reply
xp: 20
difficulty: 1
tags: [runnables]
free: true
spec:
  language: python
  runner: docker-python
  prompt: prompt.md
  entry: main.py
  starter: starter.py
  solution: solution.py
  limits: { timeout_ms: 5000, memory_mb: 256 }
  examples:
    - input: 'stream_tokens(model, "count")  # model replies "one two three"'
      output: '["one", " ", "two", " ", "three"]'
      explanation: the fake model streams one chunk per word and space
  constraints:
    - "Return the chunk contents in the order they arrive"
    - "Do not call invoke(); the point is to stream"
  hints:
    - What does iterating over model.stream(question) give you?
    - Each chunk is an AIMessageChunk. Which attribute holds its text?
  checks:
    - kind: unit_tests
      file: tests_visible.py
      visible: true
    - kind: unit_tests
      file: tests_hidden.py
      weight: 2
    - kind: forbidden_calls
      names: [invoke]
      message: Use model.stream() instead of invoke()
