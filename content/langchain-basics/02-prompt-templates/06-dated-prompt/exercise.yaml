id: lc.prompts.dated-prompt
type: code
version: 1
title: Fill a variable at invoke time
xp: 30
difficulty: 2
tags: [prompts]
spec:
  language: python
  runner: docker-python
  prompt: prompt.md
  entry: main.py
  starter: starter.py
  solution: solution.py
  limits: { timeout_ms: 5000, memory_mb: 256 }
  examples:
    - input: 'make_dated_prompt().invoke({"question": "What day is it?"})'
      output: 'system: "Today is 2026-11-02." / human: "What day is it?"'
      explanation: today() runs when the prompt is invoked, not when it is built
  constraints:
    - "Pass the today function itself to .partial(), not today()"
  hints:
    - What is the difference between partial(today=today) and partial(today=today())?
  checks:
    - kind: unit_tests
      file: tests_visible.py
      visible: true
    - kind: unit_tests
      file: tests_hidden.py
      weight: 2
