id: lc.prompts.escape-braces
type: mcq
version: 1
title: Literal braces
xp: 10
difficulty: 2
tags: [prompts]
spec:
  question: prompt.md
  multiple: false
  options:
    - { id: a, text: "Double them: {{\"label\": \"positive\"}}" }
    - { id: b, text: "Backslash them: \\{\"label\": \"positive\"\\}" }
    - { id: c, text: "Nothing; templates ignore braces inside quotes" }
    - { id: d, text: "Wrap the example in triple quotes" }
  answer: [a]
  explain: Templates treat {name} as a variable, so literal braces are written {{ and }}. This comes up whenever a prompt shows a JSON example.
