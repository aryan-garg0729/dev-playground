id: k8s.triage.no-endpoints
type: project_cli
version: 1
title: Healthy Pods, Empty Service
xp: 20
difficulty: 2
tags: [debugging, services]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: status-board's Service has 2 ready endpoints
      cli_command:
        command: echo "endpoints=$(kubectl --context kind-elixirbytes -n triage get endpointslices -l kubernetes.io/service-name=status-board -o jsonpath='{range .items[*].endpoints[?(@.conditions.ready==true)]}{.addresses[0]} {end}' | wc -w | tr -d ' ')"
        tests:
          - stdout_contains_all: ["endpoints=2"]
    - description: The pods kept their labels; the Service was fixed
      cli_command:
        command: kubectl --context kind-elixirbytes -n triage get deploy status-board -o jsonpath='pods={.spec.template.metadata.labels.app}'
        tests:
          - stdout_contains_all: ["pods=status-board"]
    - description: The board answers through its Service
      cli_command:
        command: kubectl --context kind-elixirbytes -n shop exec storefront -- wget -qO- -T 5 http://status-board.triage
        tests:
          - stdout_contains_all: ["Welcome to nginx"]
    - description: incident.txt names the cause
      cli_command:
        command: grep -Ei '^board_cause=.*(selector|label|endpoint)' incident.txt
        tests:
          - exit_code: 0
