id: k8s.triage.pager-boss
type: project_cli
version: 1
title: The 3am Pager
xp: 70
difficulty: 5
boss: true
tags: [debugging, configmaps, probes, services]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: night-orders runs 2 ready pods
      cli_command:
        command: kubectl --context kind-elixirbytes -n triage get deploy night-orders -o jsonpath='ready={.status.readyReplicas} updated={.status.updatedReplicas}'
        tests:
          - exit_code: 0
          - stdout_contains_all: ["ready=2", "updated=2"]
    - description: The pods got QUEUE_URL from the ConfigMap
      cli_command:
        command: kubectl --context kind-elixirbytes -n triage exec deploy/night-orders -- sh -c 'echo "queue=$QUEUE_URL"'
        tests:
          - stdout_contains_all: ["queue=amqp://queue.elixirbytes.internal/orders"]
    - description: Customers get the page through the Service
      cli_command:
        command: kubectl --context kind-elixirbytes -n shop exec storefront -- wget -qO- -T 5 http://night-orders.triage
        tests:
          - stdout_contains_all: ["Welcome to nginx"]
    - description: incident.txt explains the config fault
      cli_command:
        command: grep -Ei '^config_cause=.*(key|configmap|queue)' incident.txt
        tests:
          - exit_code: 0
    - description: incident.txt explains the readiness fault
      cli_command:
        command: grep -Ei '^probe_cause=.*(probe|readiness|port)' incident.txt
        tests:
          - exit_code: 0
    - description: incident.txt explains the Service fault
      cli_command:
        command: grep -Ei '^service_cause=.*(targetport|port)' incident.txt
        tests:
          - exit_code: 0
