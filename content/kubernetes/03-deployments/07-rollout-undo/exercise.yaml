id: k8s.deployments.rollout-undo
type: project_cli
version: 1
title: Ship It, Then Unship It
xp: 25
difficulty: 3
tags: [deployments, rollouts, rollback]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: brewd is back on nginx:1.27-alpine and fully rolled out
      cli_command:
        command: kubectl --context kind-elixirbytes -n shop get deploy brewd -o jsonpath='image={.spec.template.spec.containers[0].image} ready={.status.readyReplicas} updated={.status.updatedReplicas} rev={.metadata.annotations.deployment\.kubernetes\.io/revision}'
        captures: [{ name: rev, regex: "rev=(\\d+)" }]
        tests:
          - stdout_contains_all: ["image=nginx:1.27-alpine", "ready=4", "updated=4"]
    - description: The revision counter reached at least 3
      cli_command:
        command: test ${rev} -ge 3 && echo "revision ${rev}"
        tests:
          - exit_code: 0
    - description: The 1.28 ReplicaSet is still there, scaled to 0
      cli_command:
        command: kubectl --context kind-elixirbytes -n shop get rs -l app=brewd -o jsonpath='{range .items[*]}{.spec.template.spec.containers[0].image}={.spec.replicas} {end}'
        tests:
          - stdout_contains_all: ["nginx:1.28-alpine=0", "nginx:1.27-alpine=4"]
