id: k8s.services.dns
type: project_cli
version: 1
title: Finding brewd by Name
xp: 25
difficulty: 3
tags: [services, dns, namespaces]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: storefront reaches brewd by its short name
      cli_command:
        command: kubectl --context kind-elixirbytes -n shop exec storefront -- wget -qO- -T 5 http://brewd
        tests:
          - exit_code: 0
          - stdout_contains_all: ["Welcome to nginx"]
    - description: Resolve brewd's full DNS name
      cli_command:
        command: kubectl --context kind-elixirbytes -n shop exec storefront -- nslookup brewd
        captures: [{ name: fqdn, regex: "Name:\\s+(brewd\\.\\S+)" }]
        tests:
          - stdout_contains_all: ["Name:"]
    - description: answers.txt records brewd's fully qualified name
      cli_command:
        command: grep -x 'brewd_fqdn=${fqdn}' answers.txt
        tests:
          - exit_code: 0
    - description: visitor in shop-staging reaches brewd across namespaces
      cli_command:
        command: kubectl --context kind-elixirbytes -n shop-staging exec visitor -- wget -qO- -T 5 http://brewd.shop
        tests:
          - exit_code: 0
          - stdout_contains_all: ["Welcome to nginx"]
