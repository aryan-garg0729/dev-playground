id: k8s.services.empty-endpoints
type: project_cli
version: 1
title: The Service That Serves Nothing
xp: 20
difficulty: 2
tags: [services, selectors, debugging]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: The potion-api pods still carry their original label
      cli_command:
        command: kubectl --context kind-elixirbytes -n shop get deploy potion-api -o jsonpath='pods={.spec.template.metadata.labels.app} ready={.status.readyReplicas}'
        tests:
          - stdout_contains_all: ["pods=potion-api", "ready=2"]
    - description: The Service now selects them
      cli_command:
        command: kubectl --context kind-elixirbytes -n shop get svc potion-api -o jsonpath='selector={.spec.selector.app}.'
        tests:
          - stdout_contains_all: ["selector=potion-api."]
    - description: The Service has 2 ready endpoints
      cli_command:
        command: echo "endpoints=$(kubectl --context kind-elixirbytes -n shop get endpointslices -l kubernetes.io/service-name=potion-api -o jsonpath='{range .items[*].endpoints[?(@.conditions.ready==true)]}{.addresses[0]} {end}' | wc -w | tr -d ' ')"
        tests:
          - stdout_contains_all: ["endpoints=2"]
