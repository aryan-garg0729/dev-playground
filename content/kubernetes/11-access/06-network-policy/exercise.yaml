id: k8s.access.network-policy
type: project_cli
version: 1
title: Locked Doors
xp: 25
difficulty: 4
tags: [networkpolicy, security]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: NetworkPolicy vault-proxy-ingress guards the vault-proxy pods
      cli_command:
        command: kubectl --context kind-elixirbytes -n shop get networkpolicy vault-proxy-ingress -o jsonpath='pods={.spec.podSelector.matchLabels.app} types={.spec.policyTypes[*]} from={.spec.ingress[0].from[0].podSelector.matchLabels.role}'
        tests:
          - exit_code: 0
          - stdout_contains_all: ["pods=vault-proxy", "types=Ingress", "from=vault-client"]
    - description: Find a vault-proxy pod's IP
      cli_command:
        command: kubectl --context kind-elixirbytes -n shop get pods -l app=vault-proxy -o jsonpath='ip={.items[0].status.podIP}'
        captures: [{ name: ip, regex: "ip=(\\S+)" }]
        tests:
          - stdout_contains_all: ["ip="]
    - description: storefront (no role label) is blocked
      cli_command:
        command: kubectl --context kind-elixirbytes -n shop exec storefront -- wget -qO- -T 3 http://${ip} >/dev/null 2>&1 && echo allowed || echo blocked
        tests:
          - stdout_contains_all: ["blocked"]
    - description: vault-client (role=vault-client) gets through
      cli_command:
        command: kubectl --context kind-elixirbytes -n shop exec vault-client -- wget -qO- -T 3 http://${ip}
        tests:
          - exit_code: 0
          - stdout_contains_all: ["Welcome to nginx"]
