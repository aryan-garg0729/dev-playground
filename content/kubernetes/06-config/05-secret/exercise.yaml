id: k8s.config.secret
type: project_cli
version: 1
title: Things You Shouldn't Commit
xp: 20
difficulty: 2
tags: [secrets]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: Secret brewd-db is an Opaque secret with username and password
      cli_command:
        command: kubectl --context kind-elixirbytes -n shop get secret brewd-db -o jsonpath='type={.type} keys={.data}' | sed -E 's/":"[^"]*"/:***/g'
        tests:
          - exit_code: 0
          - stdout_contains_all: ["type=Opaque", "username", "password"]
    - description: The username is brewd and the password is long enough
      cli_command:
        command: >-
          echo "user=$(kubectl --context kind-elixirbytes -n shop get secret brewd-db -o jsonpath='{.data.username}' | base64 -d) pwlen=$(kubectl --context kind-elixirbytes -n shop get secret brewd-db -o jsonpath='{.data.password}' | base64 -d | wc -c | tr -d ' ')"
        captures: [{ name: pwlen, regex: "pwlen=(\\d+)" }]
        tests:
          - stdout_contains_all: ["user=brewd "]
    - description: The password has at least 16 characters
      cli_command:
        command: test ${pwlen} -ge 16 && echo "length ok"
        tests:
          - exit_code: 0
    - description: No password was written into manifests/
      cli_command:
        command: "! grep -rl 'kind: Secret' manifests/ && echo 'no secret manifests'"
        tests:
          - exit_code: 0
