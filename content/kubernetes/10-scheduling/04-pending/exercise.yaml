id: k8s.scheduling.pending
type: project_cli
version: 1
title: Reading a Pending Pod
xp: 20
difficulty: 3
tags: [scheduling, debugging]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: stubborn is stuck Pending, aimed at worker2
      cli_command:
        command: kubectl --context kind-elixirbytes -n shop get pod stubborn -o jsonpath='phase={.status.phase} node={.spec.nodeName}. selector={.spec.nodeSelector.kubernetes\.io/hostname}'
        tests:
          - exit_code: 0
          - stdout_contains_all: ["phase=Pending", "node=.", "selector=elixirbytes-worker2"]
    - description: Read the scheduler's own explanation
      cli_command:
        command: kubectl --context kind-elixirbytes -n shop get pod stubborn -o jsonpath='{.status.conditions[?(@.type=="PodScheduled")].message}'
        captures:
          - { name: tainted, regex: "(\\d+) node\\(s\\) had untolerated taint" }
          - { name: mismatch, regex: "(\\d+) node\\(s\\) didn't match Pod's node affinity" }
        tests:
          - stdout_contains_all: ["untolerated taint"]
    - description: answers.txt records how many nodes each rule ruled out
      cli_command:
        command: grep -x 'stubborn_tainted=${tainted}' answers.txt && grep -x 'stubborn_mismatch=${mismatch}' answers.txt
        tests:
          - exit_code: 0
