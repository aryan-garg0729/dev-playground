id: k8s.pods.inside-the-pod
type: project_cli
version: 1
title: Logs, Exec and Port-Forward
xp: 20
difficulty: 2
tags: [pods, debugging]
free: true
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: The storefront page was edited from inside the pod
      cli_command:
        command: kubectl --context kind-elixirbytes -n shop exec storefront -- cat /usr/share/nginx/html/index.html
        tests:
          - exit_code: 0
          - stdout_contains_all: ["Welcome to ElixirBytes"]
          - stdout_contains_none: ["Welcome to nginx"]
    - description: Someone fetched the page through a port-forward
      cli_command:
        command: kubectl --context kind-elixirbytes -n shop logs storefront
        tests:
          - stdout_contains_all: ["\"GET / HTTP/1.1\" 200"]
