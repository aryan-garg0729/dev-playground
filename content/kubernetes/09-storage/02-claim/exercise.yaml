id: k8s.storage.claim
type: project_cli
version: 1
title: Claiming Storage
xp: 20
difficulty: 2
tags: [storage, pvc]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: PVC orders asks for 1Gi, ReadWriteOnce, from the default class
      cli_command:
        command: kubectl --context kind-elixirbytes -n shop get pvc orders -o jsonpath='size={.spec.resources.requests.storage} modes={.spec.accessModes[*]} class={.spec.storageClassName} phase={.status.phase}'
        captures: [{ name: phase, regex: "phase=(\\w+)" }]
        tests:
          - exit_code: 0
          - stdout_contains_all: ["size=1Gi", "modes=ReadWriteOnce", "class=standard"]
    - description: answers.txt records the claim's phase before anything uses it
      cli_command:
        command: grep -x 'orders_phase=${phase}' answers.txt
        tests:
          - exit_code: 0
    - description: The events explain the phase
      cli_command:
        command: >-
          kubectl --context kind-elixirbytes -n shop get events --field-selector involvedObject.name=orders,involvedObject.kind=PersistentVolumeClaim -o jsonpath='{range .items[*]}{.reason}: {.message}{"\n"}{end}'
        tests:
          - stdout_contains_all: ["WaitForFirstConsumer"]
