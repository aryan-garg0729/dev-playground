  answer: [c]
  explain: "`cur` is clamped to 0 at every step and `best` never drops below its starting 0, so the result is 0: the sum of an *empty* subarray. The task wants a non-empty one, so the right answer is −1. Start from `a[0]` (or negative infinity) and use `max(x, cur + x)`. Any test where every value is negative catches this."
