  explain: "You make 3 teleports to reach the cycle, then 5 more take you around it and back to the first cycle planet, which you've seen: 3 + 5 = 8. Every planet on the cycle has the answer 5. Compute it with an iterative walk that stops either at a planet that's already solved (add its answer) or at one on the current walk (you've found a new cycle). Each planet is processed once: O(n)."
