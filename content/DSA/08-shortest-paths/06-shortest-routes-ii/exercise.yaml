  answer: [a]
  explain: "The starting matrix holds the best *direct* road, so take the minimum over all roads between the same pair: `dist[a][b] = min(dist[a][b], c)`, and the same for `dist[b][a]`, since roads go both ways. Overwriting with the last road read is a bug that only fails on tests with duplicate roads."
