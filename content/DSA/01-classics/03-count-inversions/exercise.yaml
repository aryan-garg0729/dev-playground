  answer: [c]
  explain: "`4` is smaller than every element still waiting in `left`, which is `5` and `8`: `len(left) - i = 3 - 1 = 2`. The `3` was merged earlier because it's smaller than `4`, so it doesn't form an inversion with it. Adding `len(left)` (3) instead of `len(left) - i` is the classic slip."
