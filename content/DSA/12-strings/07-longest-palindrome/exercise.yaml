id: dsa.strings.longest-palindrome
type: mcq
version: 1
title: "Longest Palindrome"
xp: 10
difficulty: 3
tags: [strings, palindromes]
free: true
spec:
  question: prompt.md
  multiple: false
  options:
    - { id: a, text: "At i − p[i] = 4" }
    - { id: b, text: "At i // 2 = 4" }
    - { id: c, text: "At (i − p[i]) // 2 + 1 = 3" }
    - { id: d, text: "At (i − p[i]) // 2 = 2" }
  answer: [d]
  explain: "In t the palindrome covers positions i − p[i] to i + p[i], that is 4 to 14. The characters of s sit at odd positions (s[k] is at 2k + 1), so the first real character is at position 5, which is s[2]. The length is p[i] = 5, so the answer is `s[2:7]`. Off-by-one slips in this conversion cause most wrong answers with Manacher."
