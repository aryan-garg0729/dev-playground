  answer: [a]
  explain: "`pi[6] = 3` ('aba'), then `pi[2] = 1` ('a'), then `pi[0] = 0` ends the chain. Sorted, that's 1 3. The whole string isn't a border because a border must be proper, so 7 doesn't count. Every border of s is somewhere in that chain, which is why it lists them all in O(n)."
