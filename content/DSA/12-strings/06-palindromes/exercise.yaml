  answer: [c]
  explain: "'abba' has no middle character, but in '#a#b#b#a#' its centre is the `#` between the two b's. Every palindrome in t has odd length, and its radius `p[i]` equals the length of the original palindrome in s. The bounds checks in the `while` stop it from running off either end."
