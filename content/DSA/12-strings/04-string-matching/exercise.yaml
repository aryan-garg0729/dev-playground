title: "String Matching"
xp: 10
difficulty: 2
tags: [strings, kmp]
free: true
spec:
  question: prompt.md
  multiple: false
  options:
    - { id: a, text: "2" }
    - { id: b, text: "4" }
    - { id: c, text: "3" }
    - { id: d, text: "1" }
  answer: [c]
  explain: "Occurrences start at positions 0, 1 and 2, and overlapping ones count. Python's `text.count('aa')` gives 2, because it skips past each match; that's the trap. KMP finds overlaps naturally: after a match it falls back to `pi[m − 1]` and keeps going."
