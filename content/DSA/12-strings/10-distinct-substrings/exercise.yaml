  answer: [b]
  explain: "The suffixes 'a', 'aa' and 'aaa' have 1 + 2 + 3 = 6 prefixes between them. Neighbours share 1 and 2 of those, so 6 − 3 = 3: 'a', 'aa' and 'aaa'. Use 64-bit integers: the count can reach about n²/2 = 5·10⁹."
