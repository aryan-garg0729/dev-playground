  answer: [c]
  explain: "Replace k → s, replace e → i, and insert g at the end: 3 operations. Two can't be enough: one operation must be an insert, because the lengths differ, and that leaves only one more for the two mismatched letters. The base row and column (`dp[i][0] = i`, `dp[0][j] = j`) are the cost of turning a prefix into the empty string; forgetting them is the most common bug."
