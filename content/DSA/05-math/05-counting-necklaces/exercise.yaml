    - { id: d, text: "4" }
  answer: [a]
  explain: "Rotating by 4 sends bead 0 → 4 → 2 → 0 and bead 1 → 5 → 3 → 1: two cycles of length 3, and gcd(4, 6) = 2. Each cycle must be a single colour, so this rotation fixes m² colourings. Summing m^gcd(k, n) is O(n log n). You can group the k values by their gcd using Euler's totient, but the limits here don't need it."
