  answer: [b]
  explain: "One BFS from any node finds a, one from a finds b (and gives `dist_a`), and one from b gives `dist_b`. The answer for v is `max(dist_a[v], dist_b[v])`. Three O(n) passes, instead of one BFS from every node at O(n²). Rerooting DP, later in this chapter, gets the same answer another way and generalizes further."
