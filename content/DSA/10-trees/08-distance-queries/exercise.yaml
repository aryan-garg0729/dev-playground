  answer: [b]
  explain: "a climbs 5 − 2 = 3 edges to the LCA and b climbs 3 − 2 = 1, so the distance is 3 + 1 = 4 = 5 + 3 − 2 · 2. Subtracting the LCA's depth only once (6) counts the path from the root to the LCA once too often."
