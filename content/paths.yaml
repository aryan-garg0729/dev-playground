# Career paths: courses in order. `goal` matches the onboarding goal
# (zero, backend, interviews, ai) and marks the path as the learner's own.
paths:
  - id: backend-developer
    title: Backend Developer
    description: Python and SQL in the browser, then real commands on your machine.
    goal: backend
    courses:
      - { course: git, note: Version control on your machine }
      - { course: docker, note: Containerise a real service }
      - { course: kubernetes, note: Run it on a cluster }
  - id: interview-prep
    title: Interview Prep
    description: Revise data structures and algorithms, then practise classic problems.
    goal: interviews
    courses:
      - { course: dsa, note: "Patterns, then CSES, AtCoder and LeetCode practice" }
