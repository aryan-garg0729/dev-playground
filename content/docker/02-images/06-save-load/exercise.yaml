id: dk.images.save-load
type: project_cli
version: 1
title: Ship Without a Registry
xp: 20
difficulty: 2
tags: [images]
free: true
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: base.tar is an image archive
      cli_command:
        command: tar -tf base.tar
        tests:
          - exit_code: 0
          - stdout_contains_all: ["manifest.json", "blobs/"]
    - description: The archive carries the elixirbytes/base:mine tag
      cli_command:
        command: tar -xOf base.tar manifest.json
        tests:
          - exit_code: 0
          - stdout_contains_all: ["elixirbytes/base:mine"]
    - description: elixirbytes/base:mine is loaded again
      cli_command:
        command: "docker image inspect -f 'tags={{json .RepoTags}}' elixirbytes/base:mine"
        tests:
          - exit_code: 0
          - stdout_contains_all: ["elixirbytes/base:mine"]
