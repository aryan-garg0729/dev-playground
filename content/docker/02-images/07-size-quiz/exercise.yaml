id: dk.images.size-quiz
type: mcq
version: 1
title: Where Did the Disk Go?
xp: 5
difficulty: 2
tags: [images, layers]
free: true
spec:
  question: prompt.md
  multiple: false
  options:
    - { id: a, text: "About 13.7 MB: the three names share one image's layers" }
    - { id: b, text: "About 41.1 MB: each row is a separate copy" }
    - { id: c, text: "About 27.4 MB: the original plus one shared copy for your tags" }
    - { id: d, text: "Nothing until a container runs; images are downloaded on demand" }
  answer: [a]
  explain: >
    docker images reports each row's full size, including layers it shares with other rows, so
    adding up the column double counts. All three names point at the same image, which is stored
    once. The same goes for different images built FROM the same base: the shared base layer is
    on disk once. docker system df shows what's really used, with a SHARED SIZE column under -v.
