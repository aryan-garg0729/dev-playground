id: dk.images.tags
type: project_cli
version: 1
title: Tags Are Pointers
xp: 20
difficulty: 1
tags: [images, tags]
free: true
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: Both new tags exist
      cli_command:
        command: "docker image inspect -f 'ok' elixirbytes/base:mine elixirbytes/base:copy"
        tests:
          - exit_code: 0
          - stdout_contains_none: ["No such image"]
    - description: All three tags point at one image
      cli_command:
        command: "docker image inspect -f '{{.Id}}' alpine:3.20 elixirbytes/base:mine elixirbytes/base:copy | sort -u | wc -l | awk '{print \"distinct=\" $1}'"
        tests:
          - exit_code: 0
          - stdout_contains_all: ["distinct=1"]
