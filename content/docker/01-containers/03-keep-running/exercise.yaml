id: dk.containers.keep-running
type: project_cli
version: 1
title: Keep It Running
xp: 20
difficulty: 1
tags: [run]
free: true
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: eb-hello is running from alpine:3.20
      cli_command:
        command: "docker inspect -f 'status={{.State.Status}} image={{.Config.Image}}' eb-hello"
        tests:
          - exit_code: 0
          - stdout_contains_all: ["status=running", "image=alpine:3.20"]
    - description: eb-hello runs in the background, not attached to your terminal
      cli_command:
        command: "docker inspect -f 'tty={{.Config.Tty}} attached={{.Config.AttachStdout}}' eb-hello"
        tests:
          - exit_code: 0
          - stdout_contains_all: ["attached=false"]
