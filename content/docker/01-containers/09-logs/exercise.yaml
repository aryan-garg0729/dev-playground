id: dk.containers.logs
type: project_cli
version: 1
title: Read the Logs
xp: 20
difficulty: 1
tags: [logs]
free: true
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: eb-ticker finished cleanly
      cli_command:
        command: "docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}}' eb-ticker"
        tests:
          - exit_code: 0
          - stdout_contains_all: ["status=exited", "exit=0"]
    - description: Its last two log lines are the final potion and the done message
      cli_command:
        command: docker logs --tail 2 eb-ticker
        tests:
          - exit_code: 0
          - stdout_contains_all: ["potion 5 brewed", "all potions brewed"]
          - stdout_contains_none: ["potion 4 brewed"]
    - description: The full log has all five potions
      cli_command:
        command: docker logs eb-ticker
        tests:
          - exit_code: 0
          - stdout_contains_all: ["potion 1 brewed", "potion 2 brewed", "potion 3 brewed", "potion 4 brewed", "potion 5 brewed"]
