id: dk.containers.setup
type: project_cli
version: 1
title: Day One at ElixirBytes
xp: 15
difficulty: 1
tags: [setup]
free: true
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: The Docker daemon answers
      cli_command:
        command: "docker version --format 'server={{.Server.Version}}'"
        tests:
          - exit_code: 0
          - stdout_contains_all: ["server="]
          - stdout_contains_none: ["Cannot connect", "permission denied"]
    - description: A container runs and prints
      cli_command:
        command: docker run --rm alpine:3.20 echo "ElixirBytes is brewing"
        tests:
          - exit_code: 0
          - stdout_contains_all: ["ElixirBytes is brewing"]
