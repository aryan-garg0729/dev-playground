id: dk.containers.process-quiz
type: mcq
version: 1
title: A Container Is a Process
xp: 5
difficulty: 1
tags: [concepts]
free: true
spec:
  question: prompt.md
  multiple: false
  options:
    - { id: a, text: "A small virtual machine with its own Linux kernel" }
    - { id: b, text: "An ordinary process on the host, given its own view of files, network and process ids" }
    - { id: c, text: "A compressed archive that Docker unpacks and executes" }
    - { id: d, text: "A program compiled specially to run inside Docker" }
  answer: [b]
  explain: >
    A container is a normal Linux process. The kernel gives it private "namespaces" (its own
    process list, network, hostname and mounts) and limits its resources with "cgroups", so it
    looks like it has a machine to itself. There is no second kernel, which is why containers
    start in milliseconds and a VM takes seconds. The archive in option c is the *image*: the
    files the process sees, not the process itself.
