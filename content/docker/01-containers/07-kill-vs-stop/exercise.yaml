id: dk.containers.kill-vs-stop
type: project_cli
version: 1
title: Kill vs Stop
xp: 25
difficulty: 2
tags: [signals, exit-codes]
free: true
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: eb-sleepy was killed with SIGKILL
      cli_command:
        command: "docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}}' eb-sleepy"
        tests:
          - exit_code: 0
          - stdout_contains_all: ["status=exited", "exit=137", "oom=false"]
    - description: eb-polite was stopped with SIGTERM
      cli_command:
        command: "docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}} init={{.HostConfig.Init}}' eb-polite"
        tests:
          - exit_code: 0
          - stdout_contains_all: ["status=exited", "exit=143", "init=true"]
