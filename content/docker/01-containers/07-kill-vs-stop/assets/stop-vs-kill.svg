<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13"><defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8a93"/></marker><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c8902a"/></marker></defs><text x="10" y="30" fill="#8a8a93" font-size="13" text-anchor="start" font-weight="700">docker stop</text><path d="M130 50L560 50" stroke="#8a8a93" stroke-width="1.5"/><circle cx="130" cy="50" r="4" fill="#c8902a"/><text x="130" y="72" fill="#c8902a" font-size="13" text-anchor="middle">SIGTERM</text><text x="250" y="40" fill="#8a8a93" font-size="13" text-anchor="middle" font-style="italic">process may clean up and exit</text><path d="M430 42L430 58" stroke="#8a8a93" stroke-width="1.5"/><text x="430" y="72" fill="#8a8a93" font-size="13" text-anchor="middle">10 s</text><circle cx="430" cy="50" r="5" fill="#8a8a93"/><text x="430" y="90" fill="#8a8a93" font-size="13" text-anchor="middle">SIGKILL if still alive</text><text x="10" y="140" fill="#8a8a93" font-size="13" text-anchor="start" font-weight="700">docker kill</text><path d="M130 160L560 160" stroke="#8a8a93" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="130" cy="160" r="5" fill="#8a8a93"/><text x="130" y="182" fill="#8a8a93" font-size="13" text-anchor="middle">SIGKILL</text><text x="330" y="150" fill="#8a8a93" font-size="13" text-anchor="middle" font-style="italic">no warning, nothing to catch</text><text x="10" y="50" fill="#8a8a93" font-size="13" text-anchor="start"></text><text x="10" y="160" fill="#8a8a93" font-size="13" text-anchor="start"></text></svg>
