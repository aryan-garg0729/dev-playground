id: dk.containers.exit-codes
type: project_cli
version: 1
title: Exit Code 42
xp: 20
difficulty: 1
tags: [exit-codes]
free: true
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: eb-crash exited with code 42 and still exists
      cli_command:
        command: "docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}}' eb-crash"
        tests:
          - exit_code: 0
          - stdout_contains_all: ["status=exited", "exit=42"]
    - description: eb-crash was made from alpine:3.20
      cli_command:
        command: "docker inspect -f 'image={{.Config.Image}}' eb-crash"
        tests:
          - exit_code: 0
          - stdout_contains_all: ["image=alpine:3.20"]
