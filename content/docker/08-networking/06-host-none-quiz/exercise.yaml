id: dk.networking.host-none-quiz
type: mcq
version: 1
title: Host and None
xp: 5
difficulty: 3
tags: [networking]
spec:
  question: prompt.md
  multiple: true
  options:
    - { id: a, text: "With --network host on Linux, brewd listens directly on the host's port 8080, and -p is ignored" }
    - { id: b, text: "With --network none, the container has only a loopback interface" }
    - { id: c, text: "--network none is a good fit for a batch job that only reads and writes a mounted volume" }
    - { id: d, text: "--network host gives the container its own private IP on a bridge" }
  answer: [a, b, c]
  explain: >
    host skips network isolation completely: the container uses the host's own interfaces, so
    brewd binds the host's 8080 directly and there's nothing to publish (two such
    containers can't both use 8080). On Docker Desktop and Colima, "host" means the VM, not your Mac.
    none gives the container a loopback interface and nothing else: no way in or out, which is
    ideal for jobs that only process files. The private bridge IP in d describes the default
    bridge driver, not host.
