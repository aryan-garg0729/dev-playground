id: dk.networking.front-of-house-boss
type: project_cli
version: 1
title: Front of House
xp: 60
difficulty: 4
tags: [networking, dns, mounts]
boss: true
spec:
  prompt: prompt.md
  base_url: http://localhost:18090
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: eb-front runs nginx on eb-net with its config read-only
      cli_command:
        command: "docker inspect -f 'image={{.Config.Image}} nets={{range $k, $v := .NetworkSettings.Networks}}{{$k}},{{end}} mounts={{range .Mounts}}{{.Destination}}:rw={{.RW}} {{end}}' eb-front"
        tests:
          - stdout_contains_all: ["image=nginx:1.27-alpine", "eb-net,"]
          - stdout_contains_all: ["/etc/nginx/conf.d/default.conf:rw=false"]
    - description: eb-api stays private, on eb-net only
      cli_command:
        command: "docker inspect -f 'nets={{range $k, $v := .NetworkSettings.Networks}}{{$k}},{{end}} ports={{json .HostConfig.PortBindings}}' eb-api"
        tests:
          - stdout_contains_all: ["nets=eb-net,", "ports={}"]
    - description: Health checks pass through the front door
      http_request:
        request: { method: GET, url: "${baseURL}/healthz" }
        tests:
          - status_code: 200
    - description: The front door proxies to brewd
      http_request:
        request: { method: GET, url: "${baseURL}/version" }
        tests:
          - body_contains: "brewd 1.6.0"
    - description: Orders go through the front door too
      http_request:
        request: { method: POST, url: "${baseURL}/orders?potion=dragonbrew" }
        tests:
          - status_code: 201
