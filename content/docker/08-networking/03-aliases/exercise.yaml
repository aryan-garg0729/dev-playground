id: dk.networking.aliases
type: project_cli
version: 1
title: Another Name for It
xp: 20
difficulty: 2
tags: [networking, dns]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: eb-api answers to the alias orders on eb-net
      cli_command:
        command: "docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}}={{json $v.Aliases}} {{end}}' eb-api"
        tests:
          - stdout_contains_all: ["eb-net=", "\"orders\""]
    - description: The alias resolves for other containers on eb-net
      cli_command:
        command: docker run --rm --network eb-net alpine:3.20 wget -qO- -T 3 http://orders:8080/healthz
        tests:
          - exit_code: 0
          - stdout_contains_all: ["ok"]
    - description: The real name still works too
      cli_command:
        command: docker run --rm --network eb-net alpine:3.20 wget -qO- -T 3 http://eb-api:8080/version
        tests:
          - stdout_contains_all: ["brewd"]
