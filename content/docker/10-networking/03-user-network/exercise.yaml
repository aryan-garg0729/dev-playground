id: dk.networking.user-network
type: project_cli
version: 1
title: Your Own Network
xp: 25
difficulty: 2
tags: [networks, dns]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: The network cq-net exists
      cli_command:
        command: "docker network inspect -f 'name={{.Name}} driver={{.Driver}}' cq-net"
        tests:
          - exit_code: 0
          - stdout_contains_all: ["name=cq-net", "driver=bridge"]
    - description: cq-api is on cq-net and publishes no ports
      cli_command:
        command: "docker inspect -f 'nets={{range $k, $v := .NetworkSettings.Networks}}{{$k}},{{end}} ports={{json .HostConfig.PortBindings}} image={{.Config.Image}}' cq-api"
        tests:
          - exit_code: 0
          - stdout_contains_all: ["nets=cq-net,", "ports={}", "image=cq/webapp:1.6"]
    - description: Another container on cq-net reaches cq-api by name
      cli_command:
        command: docker run --rm --network cq-net alpine:3.20 wget -qO- -T 3 http://cq-api:8080/healthz
        tests:
          - exit_code: 0
          - stdout_contains_all: ["ok"]
