id: dk.dockerfile.run-cd-quiz
type: mcq
version: 1
title: Spot the Bug
xp: 5
difficulty: 2
tags: [dockerfile]
spec:
  question: prompt.md
  multiple: false
  options:
    - { id: a, text: "It works: the cd on line 3 puts later steps in /src" }
    - { id: b, text: "Line 4 runs in /, not /src, so go build finds no Go files" }
    - { id: c, text: "COPY must come after RUN" }
    - { id: d, text: "golang images can't run cd" }
  answer: [b]
  explain: >
    Each RUN starts a fresh shell, so a cd lasts only until the end of that RUN. Line 4 starts
    back in the image's working directory, which is / here, and go build fails with no Go files
    to build. Use WORKDIR /src, which sticks for every later instruction, or chain the commands in
    one RUN: RUN cd /src && go build ... WORKDIR is the clearer choice.
