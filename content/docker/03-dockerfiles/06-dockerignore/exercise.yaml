id: dk.dockerfile.dockerignore
type: project_cli
version: 1
title: Leave the Junk Behind
xp: 20
difficulty: 2
tags: [build, context]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: .dockerignore excludes the test fixtures
      cli_command:
        command: cat .dockerignore
        tests:
          - exit_code: 0
          - stdout_contains_all: ["testdata"]
    - description: elixirbytes/brewd:lean has the source but no testdata
      cli_command:
        command: docker run --rm elixirbytes/brewd:lean ls /src
        tests:
          - exit_code: 0
          - stdout_contains_all: ["main.go", "go.mod"]
          - stdout_contains_none: ["testdata"]
    - description: brewd still runs in the lean image
      cli_command:
        command: docker run --rm elixirbytes/brewd:lean brewd --version
        tests:
          - exit_code: 0
          - stdout_contains_all: ["brewd dev"]
