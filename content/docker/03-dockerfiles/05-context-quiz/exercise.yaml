id: dk.dockerfile.context-quiz
type: mcq
version: 1
title: The Build Context
xp: 5
difficulty: 2
tags: [build, context]
spec:
  question: prompt.md
  multiple: false
  options:
    - { id: a, text: "The Dockerfile is too long" }
    - { id: b, text: "The final argument, ~, is the build context, so every file in Dex's home folder is sent to the builder" }
    - { id: c, text: "-f makes Docker scan the whole disk for COPY sources" }
    - { id: d, text: "The golang image is being downloaded again" }
  answer: [b]
  explain: >
    The last argument to docker build is the build context: the folder whose files are sent
    to the builder and the only place COPY can read from. It isn't "where the Dockerfile is".
    -f just says which Dockerfile to use. Pointing the context at a home folder ships every
    photo, cache and repo in it. Run builds from the project folder (docker build .), and
    use .dockerignore for what's left over.
