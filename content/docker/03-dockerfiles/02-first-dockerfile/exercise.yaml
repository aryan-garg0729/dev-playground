id: dk.dockerfile.first-dockerfile
type: project_cli
version: 1
title: Your First Dockerfile
xp: 25
difficulty: 2
tags: [dockerfile, build]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: The image starts brewd by default, in JSON form
      cli_command:
        command: "docker image inspect -f 'cmd={{json .Config.Cmd}} workdir={{.Config.WorkingDir}}' elixirbytes/brewd:v1"
        tests:
          - exit_code: 0
          - stdout_contains_all: ["brewd\"]", "workdir=/src"]
          - stdout_contains_none: ["/bin/sh\",\"-c"]
    - description: The binary is at /usr/local/bin/brewd
      cli_command:
        command: docker run --rm elixirbytes/brewd:v1 which brewd
        tests:
          - exit_code: 0
          - stdout_contains_all: ["/usr/local/bin/brewd"]
    - description: brewd runs inside the image
      cli_command:
        command: docker run --rm elixirbytes/brewd:v1 brewd --version
        tests:
          - exit_code: 0
          - stdout_contains_all: ["brewd dev"]
