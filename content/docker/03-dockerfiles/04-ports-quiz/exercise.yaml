id: dk.dockerfile.ports-quiz
type: mcq
version: 1
title: The Backwards Port
xp: 5
difficulty: 2
tags: [ports]
spec:
  question: prompt.md
  multiple: false
  options:
    - { id: a, text: "It works: Docker matches up the two ports whichever way round they're written" }
    - { id: b, text: "localhost:8080 forwards to port 18080 inside the container, where nothing listens" }
    - { id: c, text: "The run fails with an error about the port order" }
    - { id: d, text: "localhost:18080 works, but only from inside the container" }
  answer: [b]
  explain: >
    -p is host:container, always. "-p 8080:18080" publishes host port 8080 and forwards it to
    container port 18080. brewd listens on 8080, so nothing is listening at 18080 inside the
    container: curl localhost:8080 connects and then gets an empty reply or a reset, and
    localhost:18080 is refused because that host port isn't published at all. Docker can't
    tell the order is wrong, because both are valid port numbers, so it doesn't complain.
