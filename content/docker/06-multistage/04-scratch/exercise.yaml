id: dk.multistage.scratch
type: project_cli
version: 1
title: Nothing at All
xp: 25
difficulty: 3
tags: [multistage, entrypoint]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: The entrypoint runs /brewd directly
      cli_command:
        command: "docker image inspect -f 'entrypoint={{json .Config.Entrypoint}} layers={{len .RootFS.Layers}}' elixirbytes/brewd:scratch"
        tests:
          - stdout_contains_all: ["entrypoint=[\"/brewd\"]", "layers=1"]
    - description: Arguments reach brewd
      cli_command:
        command: docker run --rm elixirbytes/brewd:scratch --version
        tests:
          - exit_code: 0
          - stdout_contains_all: ["brewd "]
    - description: There really is no shell
      cli_command:
        command: docker run --rm --entrypoint /bin/sh elixirbytes/brewd:scratch -c true
        tests:
          - stdout_contains_all: ["no such file"]
