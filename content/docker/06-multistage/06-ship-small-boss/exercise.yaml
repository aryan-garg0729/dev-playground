id: dk.multistage.ship-small-boss
type: project_cli
version: 1
title: Ship It Small
xp: 60
difficulty: 3
tags: [multistage, images]
boss: true
spec:
  prompt: prompt.md
  base_url: http://localhost:18086
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: elixirbytes/brewd:1.6.0 fits the size and layer budget
      cli_command:
        command: |-
          docker image inspect -f '{{.Size}} {{len .RootFS.Layers}}' elixirbytes/brewd:1.6.0 | awk '{print ($1 < 20000000 ? "size=ok" : "size=too-big"), ($2 <= 2 ? "layers=ok" : "layers=too-many")}'
        tests:
          - stdout_contains_all: ["size=ok"]
          - stdout_contains_all: ["layers=ok"]
    - description: No toolchain or source shipped
      cli_command:
        command: docker run --rm elixirbytes/brewd:1.6.0 sh -c 'command -v go || echo no-go; ls /src 2>&1'
        tests:
          - stdout_contains_all: ["no-go", "No such file"]
    - description: The image is labelled 1.6.0
      cli_command:
        command: "docker image inspect -f 'version={{index .Config.Labels \"org.opencontainers.image.version\"}}' elixirbytes/brewd:1.6.0"
        tests:
          - stdout_contains_all: ["version=1.6.0"]
    - description: eb-web6 serves version 1.6.0 on port 18086
      http_request:
        request: { method: GET, url: "${baseURL}/version" }
        tests:
          - status_code: 200
          - body_contains: "brewd 1.6.0"
