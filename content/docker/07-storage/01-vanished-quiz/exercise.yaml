id: dk.storage.vanished-quiz
type: mcq
version: 1
title: Where Did the Orders Go?
xp: 5
difficulty: 2
tags: [storage]
spec:
  question: prompt.md
  multiple: false
  options:
    - { id: a, text: "In the image: brewd wrote them into elixirbytes/brewd:1.6.0" }
    - { id: b, text: "In eb-old's writable layer, which docker rm deleted" }
    - { id: c, text: "Still in /data inside the new container, but hidden" }
    - { id: d, text: "On the host, in the folder you ran docker from" }
  answer: [b]
  explain: >
    Images are read-only, so writes land in the container's own writable layer, the thin
    copy-on-write layer on top of the image from chapter 1. docker rm deletes that layer, and
    the orders with it. The new container starts with a fresh, empty layer. Nothing reaches
    the host unless you mount something there. Data that must outlive a container belongs in
    a volume.
