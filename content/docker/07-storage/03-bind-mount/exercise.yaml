id: dk.storage.bind-mount
type: project_cli
version: 1
title: Bind Mounts
xp: 20
difficulty: 2
tags: [storage, mounts]
spec:
  prompt: prompt.md
  base_url: http://localhost:18088
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: eb-bind mounts your orders folder at /data
      cli_command:
        command: "docker inspect -f '{{range .Mounts}}{{.Type}}:{{.Source}}:{{.Destination}} {{end}}' eb-bind"
        tests:
          - stdout_contains_all: ["bind:", "/orders:/data"]
    - description: The order landed in a file on your machine
      cli_command:
        command: cat orders/orders.log
        tests:
          - exit_code: 0
          - stdout_contains_all: ["griffin"]
    - description: eb-bind serves the order
      http_request:
        request: { method: GET, url: "${baseURL}/orders" }
        tests:
          - body_contains: "griffin"
