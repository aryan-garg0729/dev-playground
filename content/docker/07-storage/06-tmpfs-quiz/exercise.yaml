id: dk.storage.tmpfs-quiz
type: mcq
version: 1
title: Scratch Space
xp: 5
difficulty: 2
tags: [storage, tmpfs]
spec:
  question: prompt.md
  multiple: false
  options:
    - { id: a, text: "A named volume, so the files are kept safely" }
    - { id: b, text: "A bind mount of a host folder" }
    - { id: c, text: "A tmpfs mount: in memory, never on disk, gone when the container stops" }
    - { id: d, text: "Leave it in the writable layer" }
  answer: [c]
  explain: >
    tmpfs lives in RAM: it's fast, never written to disk (good for anything sensitive), and
    disappears when the container stops, which is exactly what scratch files need. A volume or
    bind mount would keep secrets on disk long after they're needed. The writable layer is also
    on disk and survives a restart; with --read-only (chapter 10), it isn't writable at all,
    which is the usual reason a hardened container needs a tmpfs /tmp.
