id: dk.compose.first-stack
type: project_cli
version: 1
title: The Stack in One File
xp: 25
difficulty: 2
tags: [compose]
spec:
  prompt: prompt.md
  base_url: http://localhost:18091
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: Compose runs the api service
      cli_command:
        command: "docker compose ps --format '{{.Service}}={{.State}}'"
        tests:
          - exit_code: 0
          - stdout_contains_all: ["api=running"]
    - description: The api container runs the image Compose built
      cli_command:
        command: "docker inspect -f 'image={{.Config.Image}}' $(docker compose ps -q api)"
        tests:
          - stdout_contains_all: ["image=elixirbytes/brewd:compose"]
    - description: brewd answers on port 18091
      http_request:
        request: { method: GET, url: "${baseURL}/healthz" }
        tests:
          - status_code: 200
