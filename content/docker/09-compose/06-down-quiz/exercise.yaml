id: dk.compose.down-quiz
type: mcq
version: 1
title: down vs down -v
xp: 5
difficulty: 2
tags: [compose, volumes]
spec:
  question: prompt.md
  multiple: true
  options:
    - { id: a, text: "docker compose down removes the containers and the project network" }
    - { id: b, text: "docker compose down keeps the ledger volume, so the orders survive" }
    - { id: c, text: "docker compose down -v also deletes the ledger volume and every order in it" }
    - { id: d, text: "docker compose stop deletes the containers but keeps the volume" }
  answer: [a, b, c]
  explain: >
    down removes containers and networks but leaves named volumes alone, so the next up finds
    the ledger intact. -v adds the volumes, which is right for a throwaway dev database and a
    disaster for the order ledger. stop only stops the containers; nothing is removed, and
    start brings them back as they were.
