id: dk.compose.profiles
type: project_cli
version: 1
title: Tools on Demand
xp: 20
difficulty: 2
tags: [compose]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: toolbox is not part of the normal stack
      cli_command:
        command: docker compose config --services
        tests:
          - stdout_contains_all: ["api", "front"]
          - stdout_contains_none: ["toolbox"]
    - description: toolbox appears with the debug profile
      cli_command:
        command: docker compose --profile debug config --services
        tests:
          - stdout_contains_all: ["toolbox"]
    - description: toolbox is running, and can reach api by name
      cli_command:
        command: docker compose --profile debug exec -T toolbox wget -qO- -T 3 http://api:8080/healthz
        tests:
          - exit_code: 0
          - stdout_contains_all: ["ok"]
