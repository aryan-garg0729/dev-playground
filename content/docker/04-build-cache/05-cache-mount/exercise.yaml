id: dk.cache.cache-mount
type: project_cli
version: 1
title: A Cache That Survives
xp: 25
difficulty: 3
tags: [cache, buildkit]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: The build step mounts a cache for the Go compiler
      cli_command:
        command: grep -- '--mount=type=cache' Dockerfile
        tests:
          - exit_code: 0
          - stdout_contains_all: ["target=/root/.cache/go-build"]
    - description: build.log shows the dependency step was reused
      cli_command:
        command: grep -A1 'RUN go mod download' build.log
        tests:
          - stdout_contains_all: ["CACHED"]
    - description: build.log shows the build step ran with the cache mount
      cli_command:
        command: grep -- '--mount=type=cache' build.log
        tests:
          - exit_code: 0
    - description: The compiler cache is not inside the image
      cli_command:
        command: docker run --rm elixirbytes/brewd:v4 sh -c 'ls /root/.cache/go-build 2>&1 | head -n 3'
        tests:
          - stdout_contains_all: ["No such file"]
