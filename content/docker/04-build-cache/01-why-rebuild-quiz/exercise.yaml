id: dk.cache.why-rebuild-quiz
type: mcq
version: 1
title: Why Does It Rebuild Everything?
xp: 5
difficulty: 2
tags: [cache]
spec:
  question: prompt.md
  multiple: false
  options:
    - { id: a, text: "Line 4 and everything after it" }
    - { id: b, text: "Only line 4, because only the source changed" }
    - { id: c, text: "Line 3 and everything after it" }
    - { id: d, text: "Every line, because Docker never caches RUN steps" }
  answer: [c]
  explain: >
    A COPY step's cache key includes a checksum of the files it copies. Line 3 copies all of
    app/, main.go included, so editing main.go changes line 3's key and it misses the cache.
    Once one step misses, every later step runs again too, because each step builds on the one
    before it. Line 4's dependency download runs again even though go.mod didn't change: that's
    the four-minute build.
