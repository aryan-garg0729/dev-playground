id: dk.ports.env-vars
type: project_cli
version: 1
title: Settings with -e
xp: 20
difficulty: 1
tags: [env]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: cq-settings is running from alpine:3.20
      cli_command:
        command: "docker inspect -f 'status={{.State.Status}} image={{.Config.Image}}' cq-settings"
        tests:
          - exit_code: 0
          - stdout_contains_all: ["status=running", "image=alpine:3.20"]
    - description: cq-settings has MODE=practice and LEVEL=3
      cli_command:
        command: docker exec cq-settings printenv MODE LEVEL
        tests:
          - exit_code: 0
          - stdout_contains_all: ["practice", "3"]
