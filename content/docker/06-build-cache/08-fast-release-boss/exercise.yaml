id: dk.cache.fast-release-boss
type: project_cli
version: 1
title: Fast Release 1.3
xp: 50
difficulty: 3
tags: [cache, arg]
boss: true
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: cq/webapp:1.3 reports version 1.3 and carries the 1.3 label
      cli_command:
        command: "docker run --rm cq/webapp:1.3 webapp --version && docker image inspect -f 'label={{index .Config.Labels \"org.opencontainers.image.version\"}}' cq/webapp:1.3"
        tests:
          - stdout_contains_all: ["webapp 1.3", "label=1.3"]
    - description: No build argument leaked into containers
      cli_command:
        command: docker run --rm cq/webapp:1.3 printenv VERSION
        tests:
          - exit_code: 1
    - description: In cq/webapp:1.3, libraries are downloaded before the code is copied
      cli_command:
        command: |-
          docker history --no-trunc --format '{{.CreatedBy}}' cq/webapp:1.3 | awk '/go mod download/{d=NR} /COPY app\/ \./{c=NR} END{if (d > c && c > 0) print "order=deps-first"; else print "order=code-first"}'
        tests:
          - stdout_contains_all: ["order=deps-first"]
    - description: In release.log, the library download was reused
      cli_command:
        command: grep -A1 'RUN go mod download' release.log
        tests:
          - stdout_contains_all: ["CACHED"]
    - description: In release.log, the changed code was copied fresh
      cli_command:
        command: grep -A1 'COPY app/ \.' release.log
        tests:
          - stdout_contains_none: ["CACHED"]
    - description: In release.log, the build used the compiler cache mount
      cli_command:
        command: grep -c -- '--mount=type=cache' release.log
        tests:
          - exit_code: 0
