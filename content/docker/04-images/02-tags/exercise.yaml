id: dk.images.tags
type: project_cli
version: 1
title: Tags Are Nicknames
xp: 20
difficulty: 1
tags: [tags]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: cq/base:mine and cq/base:copy both exist
      cli_command:
        command: "docker image inspect -f 'ok' cq/base:mine cq/base:copy"
        tests:
          - exit_code: 0
    - description: alpine:3.20, cq/base:mine and cq/base:copy are one and the same image
      cli_command:
        command: "docker image inspect -f '{{.Id}}' alpine:3.20 cq/base:mine cq/base:copy | sort -u | wc -l | awk '{print \"distinct=\" $1}'"
        tests:
          - exit_code: 0
          - stdout_contains_all: ["distinct=1"]
