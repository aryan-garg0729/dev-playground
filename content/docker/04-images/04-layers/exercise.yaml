id: dk.images.layers
type: project_cli
version: 1
title: Images Are Layers
xp: 20
difficulty: 2
tags: [layers]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: Count nginx:1.27-alpine's layers
      cli_command:
        command: "docker image inspect -f 'layers={{len .RootFS.Layers}}' nginx:1.27-alpine"
        captures: [{ name: layers, regex: "layers=(\\d+)" }]
        tests:
          - exit_code: 0
    - description: answers.txt has the right nginx_layers= line
      cli_command:
        command: "grep -x 'nginx_layers=${layers}' answers.txt"
        tests:
          - exit_code: 0
