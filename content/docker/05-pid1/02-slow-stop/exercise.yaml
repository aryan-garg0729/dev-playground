id: dk.pid1.slow-stop
type: project_cli
version: 1
title: The Ten-Second Stop
xp: 20
difficulty: 2
tags: [pid1, signals]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: elixirbytes/brewd:banner starts through the wrapper script
      cli_command:
        command: "docker image inspect -f 'entrypoint={{json .Config.Entrypoint}}' elixirbytes/brewd:banner"
        tests:
          - stdout_contains_all: ["entrypoint.sh"]
    - description: eb-slow had to be killed after the timeout
      cli_command:
        command: "docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}}' eb-slow"
        tests:
          - stdout_contains_all: ["status=exited", "exit=137"]
    - description: brewd printed its banner but never heard the SIGTERM
      cli_command:
        command: docker logs eb-slow
        tests:
          - stdout_contains_all: ["brewd starting"]
          - stdout_contains_none: ["shutting down"]
