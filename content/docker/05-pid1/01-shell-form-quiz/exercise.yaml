id: dk.pid1.shell-form-quiz
type: mcq
version: 1
title: Shell Form, Exec Form
xp: 5
difficulty: 2
tags: [dockerfile, cmd]
spec:
  question: prompt.md
  multiple: false
  options:
    - { id: a, text: "brewd, because CMD always runs your program directly" }
    - { id: b, text: "/bin/sh, which runs echo and then brewd as its child" }
    - { id: c, text: "echo, because it's the first command" }
    - { id: d, text: "docker-init, which Docker always adds" }
  answer: [b]
  explain: >
    Shell form becomes ["/bin/sh", "-c", "echo starting && brewd"]. A shell given several
    commands has to stay alive to run them in order, so sh is PID 1 and brewd is its child.
    (Given a single simple command, many shells, busybox's included, replace themselves with
    it. That's why `CMD brewd` happens to work, and why the bug hides until someone adds an
    echo.) docker-init only exists when you pass --init. Exec form, CMD ["brewd"], has no
    shell at all, so brewd is PID 1 by construction.
