id: dk.pid1.one-off-runs
type: project_cli
version: 1
title: Override It at Run Time
xp: 20
difficulty: 2
tags: [cmd, entrypoint]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: eb-oneoff passed --version through the wrapper
      cli_command:
        command: "docker inspect -f 'path={{.Path}} args={{json .Args}} exit={{.State.ExitCode}}' eb-oneoff"
        tests:
          - stdout_contains_all: ["path=/usr/local/bin/entrypoint.sh", "args=[\"--version\"]", "exit=0"]
    - description: eb-oneoff printed the banner, then the version
      cli_command:
        command: docker logs eb-oneoff
        tests:
          - stdout_contains_all: ["brewd starting", "brewd dev"]
    - description: eb-peek replaced the entrypoint with ls
      cli_command:
        command: "docker inspect -f 'path={{.Path}} args={{json .Args}}' eb-peek"
        tests:
          - stdout_contains_all: ["path=ls", "/usr/local/bin"]
    - description: eb-peek listed the binaries
      cli_command:
        command: docker logs eb-peek
        tests:
          - stdout_contains_all: ["brewd", "entrypoint.sh"]
