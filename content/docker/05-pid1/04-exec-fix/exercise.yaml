id: dk.pid1.exec-fix
type: project_cli
version: 1
title: One Missing Word
xp: 25
difficulty: 2
tags: [pid1, signals]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: The wrapper replaces itself with brewd
      cli_command:
        command: grep -E '^[[:space:]]*exec ' app/entrypoint.sh
        tests:
          - exit_code: 0
          - stdout_contains_all: ["brewd"]
    - description: eb-web5 stopped cleanly
      cli_command:
        command: "docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}} image={{.Config.Image}}' eb-web5"
        tests:
          - stdout_contains_all: ["status=exited", "exit=0", "image=elixirbytes/brewd:ch5"]
    - description: The banner still prints, and brewd got the SIGTERM
      cli_command:
        command: docker logs eb-web5
        tests:
          - stdout_contains_all: ["brewd starting", "brewd: shutting down"]
