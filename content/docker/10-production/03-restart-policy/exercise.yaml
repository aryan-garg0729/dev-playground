id: dk.production.restart-policy
type: project_cli
version: 1
title: Three Strikes
xp: 20
difficulty: 2
tags: [restart]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: eb-flaky retried three times, then gave up
      cli_command:
        command: "docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}} restarts={{.RestartCount}} policy={{.HostConfig.RestartPolicy.Name}}:{{.HostConfig.RestartPolicy.MaximumRetryCount}}' eb-flaky"
        tests:
          - stdout_contains_all: ["status=exited", "exit=1", "restarts=3", "policy=on-failure:3"]
    - description: Every attempt logged its crash
      cli_command:
        command: docker logs eb-flaky
        tests:
          - stdout_lines_gt: 3
          - stdout_contains_all: ["cauldron overflow"]
