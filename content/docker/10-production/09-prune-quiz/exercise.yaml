id: dk.production.prune-quiz
type: mcq
version: 1
title: The Disk Is Full
xp: 5
difficulty: 2
tags: [housekeeping]
spec:
  question: prompt.md
  multiple: false
  options:
    - { id: a, text: "docker system prune --all --volumes, to get everything back at once" }
    - { id: b, text: "docker system prune, then docker builder prune if the build cache is still large" }
    - { id: c, text: "Delete everything under /var/lib/docker by hand" }
    - { id: d, text: "docker volume prune --all" }
  answer: [b]
  explain: >
    Plain docker system prune removes stopped containers, unused networks, dangling (untagged)
    images and dangling build cache: all safe, since nothing running or tagged is touched.
    docker builder prune then clears the rest of the build cache, which only costs slower next
    builds. --volumes and docker volume prune --all delete unused named volumes, and the
    ledger counts as unused whenever its containers are stopped. Deleting Docker's files by
    hand corrupts its state.
