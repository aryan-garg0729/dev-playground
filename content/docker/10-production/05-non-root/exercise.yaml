id: dk.production.non-root
type: project_cli
version: 1
title: Don't Run as Root
xp: 25
difficulty: 3
tags: [security, dockerfile]
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: elixirbytes/brewd:prod runs as the brewer user
      cli_command:
        command: docker run --rm elixirbytes/brewd:prod id
        tests:
          - stdout_contains_all: ["uid=10001(brewer)"]
          - stdout_contains_none: ["uid=0"]
    - description: brewer can write to /data and nowhere else it shouldn't
      cli_command:
        command: docker run --rm elixirbytes/brewd:prod sh -c 'touch /data/probe && echo data=writable; touch /usr/local/bin/x 2>&1'
        tests:
          - stdout_contains_all: ["data=writable", "Permission denied"]
    - description: The image keeps its healthcheck
      cli_command:
        command: "docker image inspect -f 'hc={{json .Config.Healthcheck.Test}}' elixirbytes/brewd:prod"
        tests:
          - stdout_contains_all: ["/healthz"]
