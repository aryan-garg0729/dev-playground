id: dk.production.registry
type: project_cli
version: 1
title: Our Own Registry
xp: 25
difficulty: 3
tags: [registry, images]
spec:
  prompt: prompt.md
  base_url: http://localhost:15000
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: eb-registry listens on 127.0.0.1:15000 only
      cli_command:
        command: "docker inspect -f 'image={{.Config.Image}}' eb-registry && docker port eb-registry 5000/tcp"
        tests:
          - stdout_contains_all: ["image=registry:2", "127.0.0.1:15000"]
          - stdout_contains_none: ["0.0.0.0"]
    - description: The registry knows the brewd repository
      http_request:
        request: { method: GET, url: "${baseURL}/v2/_catalog" }
        tests:
          - json_body: { path: ".repositories", op: contains, value: "elixirbytes/brewd" }
    - description: The prod tag was pushed
      http_request:
        request: { method: GET, url: "${baseURL}/v2/elixirbytes/brewd/tags/list" }
        tests:
          - json_body: { path: ".tags", op: contains, value: "prod" }
