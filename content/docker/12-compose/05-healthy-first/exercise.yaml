id: dk.compose.healthy-first
type: project_cli
version: 1
title: Wait Until It's Healthy
xp: 25
difficulty: 3
tags: [compose, healthcheck]
spec:
  prompt: prompt.md
  base_url: http://localhost:8098
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: api is healthy and front is running
      cli_command:
        command: "docker compose ps --format '{{.Service}}={{.State}}/{{.Health}}'"
        tests:
          - stdout_contains_all: ["api=running/healthy"]
          - stdout_contains_all: ["front=running/"]
    - description: front waits for a healthy api
      cli_command:
        command: docker compose config
        tests:
          - stdout_contains_all: ["condition: service_healthy"]
    - description: The front door proxies to the api service by its service name
      http_request:
        request: { method: GET, url: "${baseURL}/" }
        tests:
          - status_code: 200
          - body_contains: "Hello from Compose"
