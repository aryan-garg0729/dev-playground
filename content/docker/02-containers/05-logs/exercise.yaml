id: dk.containers.logs
type: project_cli
version: 1
title: Read the Logs
xp: 20
difficulty: 1
tags: [logs]
free: true
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: cq-counter ran to the end without errors
      cli_command:
        command: "docker inspect -f 'status={{.State.Status}} exit={{.State.ExitCode}}' cq-counter"
        tests:
          - exit_code: 0
          - stdout_contains_all: ["status=exited", "exit=0"]
    - description: cq-counter's logs hold every count
      cli_command:
        command: docker logs cq-counter
        tests:
          - exit_code: 0
          - stdout_contains_all: ["count 1", "count 5", "all done"]
