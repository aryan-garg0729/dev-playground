id: fd.py.sum-list
type: code
version: 1
title: Sum a list
xp: 20
difficulty: 1
tags: [loops]
free: true
spec:
  language: python
  runner: pyodide
  run: browser
  prompt: prompt.md
  entry: main.py
  starter: starter.py
  solution: solution.py
  limits: { timeout_ms: 3000, memory_mb: 128 }
  examples:
    - { input: "nums = [1, 2, 3]", output: "6", explanation: "1 + 2 + 3 = 6" }
    - { input: "nums = []", output: "0", explanation: "an empty list sums to 0" }
  constraints:
    - "0 ≤ len(nums) ≤ 10⁴"
    - "-1000 ≤ nums[i] ≤ 1000"
  hints:
    - What should total start at?
    - Where does the return belong, inside the loop or after it?
  checks:
    - kind: unit_tests
      file: tests_visible.py
      visible: true
    - kind: unit_tests
      file: tests_hidden.py
      weight: 2
    - kind: forbidden_calls
      names: [sum]
      message: Try it with a loop instead of sum()
