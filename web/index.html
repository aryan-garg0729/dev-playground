<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeQuest</title>
    <!-- Set the theme before first paint: saved choice, else the OS preference. Default dark. -->
    <script>
      (function () {
        var t = 'dark';
        try {
          var saved = localStorage.getItem('cq-theme');
          if (saved === 'dark' || saved === 'light') t = saved;
          else if (window.matchMedia('(prefers-color-scheme: light)').matches) t = 'light';
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Pixelify+Sans:wght@500;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
