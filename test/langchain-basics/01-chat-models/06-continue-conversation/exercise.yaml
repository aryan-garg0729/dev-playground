id: lc.chat.continue-conversation
type: code
version: 1
title: Continue a conversation
xp: 30
difficulty: 2
tags: [messages]
spec:
  language: python
  runner: docker-python
  prompt: prompt.md
  entry: main.py
  starter: starter.py
  solution: solution.py
  limits: { timeout_ms: 5000, memory_mb: 256 }
  examples:
    - input: 'continue_conversation(model, [("human", "Hi, I''m Ada"), ("ai", "Hello Ada!")], "What''s my name?")'
      output: 'AIMessage("Your name is Ada.")'
      explanation: the model sees all three turns, so it can answer from the history
  constraints:
    - 'history is a list of (role, text) pairs, role is "human" or "ai", oldest first'
    - "Do not change the history list you were given"
  hints:
    - Chat models are stateless. What must you send so the model "remembers"?
    - Build a new list instead of appending to history.
  checks:
    - kind: unit_tests
      file: tests_visible.py
      visible: true
    - kind: unit_tests
      file: tests_hidden.py
      weight: 2
