id: go.tower.ship-count
type: code
version: 1
title: Ship count
xp: 20
difficulty: 1
tags: [input, conditionals]
free: true
spec:
  language: go
  runner: wasm
  prompt: prompt.md
  entry: main.go
  starter: starter.go
  solution: solution.go
  examples:
    - { input: "3", output: "3 ships docked" }
    - { input: "1", output: "1 ship docked", explanation: "One ship, no s" }
  hints:
    - fmt.Scan needs a pointer to the variable it fills. What does & do?
    - Which count is the odd one out in English?
  checks:
    - kind: io_cases
      name: Count
      cases:
        - { stdin: "3\n", stdout: "3 ships docked\n" }
        - { stdin: "1\n", stdout: "1 ship docked\n" }
        - { stdin: "0\n", stdout: "0 ships docked\n", visible: false, name: Empty harbor }
        - { stdin: "250\n", stdout: "250 ships docked\n", visible: false, name: Busy night }
