id: go.tower.tonnage-board
type: code
version: 1
title: Tonnage Board
xp: 50
difficulty: 3
tags: [slices, sorting, input]
free: true
boss: true
spec:
  language: go
  runner: wasm
  prompt: prompt.md
  entry: main.go
  starter: starter.go
  solution: solution.go
  examples:
    - input: "kestrel 1200\nmarlin 800\nosprey 3000"
      output: "osprey 3000\nkestrel 1200\nmarlin 800\ntotal 5000"
  constraints:
    - "Each line is a name (one word) and a whole tonnage"
    - "Ships with equal tonnage keep their input order"
  hints:
    - fmt.Scan returns an error at the end of input. Loop until it does.
    - Which sort keeps equal elements in their original order?
  checks:
    - kind: io_cases
      name: Board
      cases:
        - { stdin: "kestrel 1200\nmarlin 800\nosprey 3000\n", stdout: "osprey 3000\nkestrel 1200\nmarlin 800\ntotal 5000\n" }
        - { stdin: "dory 40\n", stdout: "dory 40\ntotal 40\n" }
        - { stdin: "", stdout: "total 0\n", visible: false, name: Empty harbor }
        - { stdin: "a 5\nb 9\nc 5\nd 9\n", stdout: "b 9\nd 9\na 5\nc 5\ntotal 28\n", visible: false, name: Ties keep their order }
        - { stdin: "barge 2000000\ntug 1\n", stdout: "barge 2000000\ntug 1\ntotal 2000001\n", visible: false, name: Big and small }
        - { stdin: "x 3\ny 2\nz 1\n", stdout: "x 3\ny 2\nz 1\ntotal 6\n", visible: false, name: Already sorted }
