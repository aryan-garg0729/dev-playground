id: fd.py.count-words
type: code
version: 1
title: Count words
xp: 20
difficulty: 2
tags: [dicts]
free: true
spec:
  language: python
  runner: pyodide
  prompt: prompt.md
  entry: main.py
  starter: starter.py
  solution: solution.py
  limits: { timeout_ms: 3000, memory_mb: 128 }
  examples:
    - input: 'count_words("the cat and the hat")'
      output: "{'the': 2, 'cat': 1, 'and': 1, 'hat': 1}"
  constraints:
    - "Words are separated by whitespace"
    - "Counting ignores case: The and the are the same word"
  hints:
    - Which string method splits on any whitespace?
    - How do you add 1 to a count that may not exist yet?
  checks:
    - kind: unit_tests
      file: tests_visible.py
      visible: true
    - kind: unit_tests
      file: tests_hidden.py
      weight: 2
