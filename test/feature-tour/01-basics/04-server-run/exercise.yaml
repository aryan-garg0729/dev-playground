id: ft.basics.server-run
type: code
version: 1
title: Run on the server
xp: 20
difficulty: 1
tags: [strings]
free: true
spec:
  language: python
  runner: docker-python
  run: server
  prompt: prompt.md
  entry: main.py
  starter: starter.py
  solution: solution.py
  limits: { timeout_ms: 5000, memory_mb: 256 }
  examples:
    - { input: 'shout("hi there")', output: '"HI THERE!"' }
  constraints:
    - "Add exactly one ! at the end"
  hints:
    - Which string method makes every letter uppercase?
  checks:
    - kind: unit_tests
      file: tests_visible.py
      visible: true
    - kind: unit_tests
      file: tests_hidden.py
      weight: 2
