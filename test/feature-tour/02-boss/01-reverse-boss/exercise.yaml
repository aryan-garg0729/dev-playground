id: ft.boss.reverse-words
type: code
version: 1
title: Reverse the words
xp: 50
difficulty: 2
tags: [strings, lists]
free: true
boss: true
spec:
  language: python
  runner: pyodide
  run: browser
  prompt: prompt.md
  entry: main.py
  starter: starter.py
  solution: solution.py
  limits: { timeout_ms: 3000, memory_mb: 128 }
  examples:
    - { input: 'reverse_words("one two three")', output: '"three two one"' }
  constraints:
    - "Words are separated by whitespace; join them with single spaces"
  hints:
    - split() with no argument splits on any whitespace.
    - How do you reverse a list? Then join it back with " ".
  checks:
    - kind: unit_tests
      file: tests_visible.py
      visible: true
    - kind: unit_tests
      file: tests_hidden.py
