id: cl.hello-script
type: project_cli
version: 1
title: Hello from your terminal
xp: 20
difficulty: 1
tags: [cli]
free: true
spec:
  prompt: prompt.md
  allowed_os: [linux, darwin]
  solution: solution.json
  steps:
    - description: Run your script
      cli_command:
        command: python3 hello.py
        tests:
          - exit_code: 0
          - stdout_contains_all: ["Hello, CodeQuest!"]
          - stdout_contains_none: ["Traceback"]
