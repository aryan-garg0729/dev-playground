name: codequest

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codequest
      POSTGRES_PASSWORD: codequest
      POSTGRES_DB: codequest
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codequest -d codequest"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    networks: [default, grading]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: apply migrations, then compile content/ into Postgres.
  setup:
    build: ./api
    environment:
      DATABASE_URL: postgres://codequest:codequest@postgres:5432/codequest?sslmode=disable
    volumes: [./content:/content:ro]
    entrypoint: ["/bin/sh", "-c", "cq migrate up && cq build /content"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://codequest:codequest@postgres:5432/codequest?sslmode=disable
      HTTP_ADDR: ":8080"
      ALLOWED_ORIGINS: http://localhost:5173
      APP_URL: http://localhost:5173
      # Development sign-in without email (POST /auth/dev); refused when APP_ENV=production.
      DEV_AUTH: ${DEV_AUTH:-1}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # Google sign-in (optional locally; dev sign-in needs neither).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      REDIS_URL: redis://redis:6379/0
      # AI tutor (development only; the API refuses it with APP_ENV=production).
      # Uses Ollama on the host: `ollama serve` and `ollama pull qwen2.5-coder:3b`.
      # Set TUTOR_PROVIDER= (empty) to turn it off.
      TUTOR_PROVIDER: ${TUTOR_PROVIDER-ollama}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      TUTOR_MODEL: ${TUTOR_MODEL:-qwen2.5-coder:3b}
      TUTOR_DAILY_LIMIT: ${TUTOR_DAILY_LIMIT:-5}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      setup: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # Builds the codequest/python grading image, checks it starts, then exits.
  runner-python:
    build: ./runners/python
    image: codequest/python:3.12
    entrypoint: ["python", "-c", "import cq, langchain_core"]
    network_mode: none

  # Grading worker. It starts runner containers through the host's Docker
  # socket, which is root-equivalent: in production it runs on its own host
  # with no other services and no database credentials.
  worker:
    build: { context: ./api, target: worker }
    environment:
      REDIS_URL: redis://redis:6379/0
      WORKER_CONCURRENCY: "2"
    volumes: [/var/run/docker.sock:/var/run/docker.sock]
    depends_on:
      redis: { condition: service_healthy }
      runner-python: { condition: service_completed_successfully }

  # Wasm grading worker (Go, JS lessons): runs learner code as WASI modules
  # in-process, so it gets no Docker socket. It is locked down like a runner
  # container and can reach only Redis.
  worker-wasm:
    build: { context: ., dockerfile: runners/wasm/Dockerfile }
    environment:
      REDIS_URL: redis://redis:6379/0
      WORKER_CONCURRENCY: "4"
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "10001"
    mem_limit: 1536m
    memswap_limit: 1536m
    pids_limit: 128
    networks: [grading]
    depends_on:
      redis: { condition: service_healthy }

  # Browser runner page (Pyodide, sql.js) on its own origin; the app embeds it
  # in <iframe sandbox="allow-scripts">.
  sandbox:
    build: { context: ., dockerfile: sandbox/Dockerfile }
    ports: ["5174:5174"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5174/"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: ./web
    environment:
      VITE_API_PROXY: http://api:8080
      VITE_SANDBOX_ORIGIN: http://localhost:5174
      VITE_POLL: "1"
    ports: ["5173:5173"]
    volumes:
      - ./web:/app
      - ./docs:/docs:ro
      - web_node_modules:/app/node_modules
    depends_on:
      api: { condition: service_healthy }

networks:
  default:
  # Redis and the wasm worker only: no route to Postgres or the API.
  grading:
    internal: true

volumes:
  pgdata:
  web_node_modules:
