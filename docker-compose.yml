name: codequest

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codequest
      POSTGRES_PASSWORD: codequest
      POSTGRES_DB: codequest
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codequest -d codequest"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: apply migrations, then compile content/ into Postgres.
  setup:
    build: ./api
    environment:
      DATABASE_URL: postgres://codequest:codequest@postgres:5432/codequest?sslmode=disable
    volumes: [./content:/content:ro]
    entrypoint: ["/bin/sh", "-c", "cq migrate up && cq build /content"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://codequest:codequest@postgres:5432/codequest?sslmode=disable
      HTTP_ADDR: ":8080"
      ALLOWED_ORIGINS: http://localhost:5173
      DEV_USER_EMAIL: ${DEV_USER_EMAIL:-dev@codequest.local}
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      setup: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build: ./web
    environment:
      VITE_API_PROXY: http://api:8080
    ports: ["5173:5173"]
    volumes:
      - ./web:/app
      - ./docs:/docs:ro
      - web_node_modules:/app/node_modules
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  web_node_modules:
