<!-- @dsCard group="Navigation" height=380 subtitle="Closed rail and open outline" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../../web/src/styles/tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap">
<style>
  body { margin: 0; background: var(--bg); font-family: var(--font-sans); }
  .wrap { display: flex; gap: var(--space-2); padding: var(--space-2); align-items: flex-start; }
  .rail { width: 48px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
  .rail button { width: 32px; height: 22px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; padding: 0; cursor: pointer; }
  .rail .open { width: 36px; height: 36px; margin-bottom: 6px; }
  .rail .open svg, .panel .close svg { stroke: var(--text-secondary); }
  .seg { width: 4px; height: 16px; border-radius: var(--radius-pill); background: var(--border-strong); }
  .done { background: var(--success); }
  .now { background: var(--progress-current); }
  .panel { width: 236px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; padding: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
  .head { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 8px 8px; font-size: 12px; font-weight: 600; color: var(--text-muted); }
  .close { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; border-radius: var(--radius-md); cursor: pointer; }
  .item { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: var(--radius-md); font-size: 13px; color: var(--text-muted); }
  .item span.name { flex: 1; }
  .item.isdone { color: var(--text-secondary); }
  .item.current { background: var(--surface-raised); box-shadow: inset 2px 0 0 var(--accent); color: var(--text); font-weight: 600; }
  [data-theme="light"] .item.current { background: var(--accent-soft); }
  .tick { stroke: var(--success); }
  .lock { stroke: var(--text-faint); }
</style>
</head>
<body>
<div class="wrap">
  <nav class="rail" aria-label="Chapter outline, closed">
    <button type="button" class="open" aria-label="Open chapter outline"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path><path d="M13 10l2 2-2 2"></path></svg></button>
    <button type="button" aria-label="1. For loops, done"><span class="seg done"></span></button>
    <button type="button" aria-label="2. Range, done"><span class="seg done"></span></button>
    <button type="button" aria-label="3. Quiz: range(), done"><span class="seg done"></span></button>
    <button type="button" aria-label="4. Sum a list, current"><span class="seg now"></span></button>
    <button type="button" aria-label="5. Find the max, not started"><span class="seg"></span></button>
    <button type="button" aria-label="6. While loops, not started"><span class="seg"></span></button>
    <button type="button" aria-label="7. Break and continue, not started"><span class="seg"></span></button>
    <button type="button" aria-label="8. Boss: FizzBuzz, locked"><span class="seg"></span></button>
  </nav>
  <nav class="panel" aria-label="Chapter outline, open">
    <div class="head"><span>Chapter 3 · Loops · 3/8</span><button type="button" class="close" aria-label="Close chapter outline"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button></div>
    <div class="item isdone"><span class="seg done"></span><span class="name">For loops</span><svg class="tick" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Done"><path d="M5 12l5 5L20 7"></path></svg></div>
    <div class="item isdone"><span class="seg done"></span><span class="name">Range</span><svg class="tick" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Done"><path d="M5 12l5 5L20 7"></path></svg></div>
    <div class="item isdone"><span class="seg done"></span><span class="name">Quiz: range()</span><svg class="tick" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Done"><path d="M5 12l5 5L20 7"></path></svg></div>
    <div class="item current"><span class="seg now"></span><span class="name">Sum a list</span></div>
    <div class="item"><span class="seg"></span><span class="name">Find the max</span></div>
    <div class="item"><span class="seg"></span><span class="name">While loops</span></div>
    <div class="item"><span class="seg"></span><span class="name">Break and continue</span></div>
    <div class="item"><span class="seg"></span><span class="name">Boss: FizzBuzz</span><svg class="lock" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Locked"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></div>
  </nav>
</div>
</body>
</html>
