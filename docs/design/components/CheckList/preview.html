<!-- @dsCard group="Feedback" height=170 subtitle="Grader result after submit" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../../web/src/styles/tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
  body { margin: 0; background: var(--bg); font-family: var(--font-sans); color: var(--text); }
  .pane { margin: var(--space-2); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .fail { font-size: 14px; font-weight: 600; color: var(--danger); }
  .ms { font-size: 12px; color: var(--text-muted); }
  .rows { display: flex; flex-direction: column; gap: 6px; font-family: var(--font-mono); font-size: 13px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .dot { width: 8px; height: 8px; border-radius: var(--radius-pill); flex: none; }
  .ok { background: var(--success); }
  .bad { background: var(--danger); }
  .pass-text { color: var(--text-secondary); }
  .wrong { color: var(--danger); }
  .exp { color: var(--text-muted); }
</style>
</head>
<body>
<div class="pane">
  <div class="top"><span class="fail">2 of 3 checks failing</span><span class="ms">84 ms</span></div>
  <div class="rows">
    <div class="row"><span class="dot ok" role="img" aria-label="Passed"></span><span class="pass-text">sum_list([5]) → 5</span></div>
    <div class="row"><span class="dot bad" role="img" aria-label="Failed"></span><span>sum_list([1, 2, 3]) → <span class="wrong">1</span> <span class="exp">(expected 6)</span></span></div>
    <div class="row"><span class="dot bad" role="img" aria-label="Failed"></span><span>sum_list([]) → <span class="wrong">None</span> <span class="exp">(expected 0)</span></span></div>
  </div>
</div>
</body>
</html>
