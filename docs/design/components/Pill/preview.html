<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../../web/src/styles/tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Silkscreen:wght@400&display=swap">
<style>
  body { margin: 0; background: var(--surface); font-family: var(--font-sans); }
  .row { display: flex; flex-wrap: wrap; gap: 6px; padding: var(--space-5); }
  .pill { font-size: 12px; font-weight: 500; line-height: 16px; padding: 3px 9px; border-radius: var(--radius-pill); }
  .easy { color: var(--success); background: var(--success-soft); }
  .topic { color: var(--text-secondary); background: var(--surface-raised); }
  .xp { font-family: var(--font-pixel); font-size: 13px; color: var(--accent-text); background: var(--accent-soft); }
</style>
</head>
<body>
<div class="row">
  <span class="pill easy">Easy</span>
  <span class="pill topic">Loops</span>
  <span class="pill xp">+20 XP</span>
</div>
</body>
</html>
