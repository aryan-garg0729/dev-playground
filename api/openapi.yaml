openapi: 3.1.0
info:
  title: CodeQuest API
  version: 0.1.0
  description: JSON API under /api/v1. Errors always use the Error envelope.
servers:
  - url: /api/v1
paths:
  /healthz:
    get:
      operationId: healthz
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { status: { type: string } }, required: [status] } } } }
        "503": { $ref: "#/components/responses/Error" }
  /me:
    get:
      operationId: getMe
      responses:
        "200":
          description: Current user
          content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } }
        "401": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateMe
      description: The user's own settings. XP, level, streak and league fields are not accepted (only grading writes them).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 80 }
                timezone: { type: string, description: IANA zone, e.g. Asia/Kolkata }
                daily_goal: { type: integer, minimum: 1, maximum: 10 }
                title: { type: string, description: One of the user's earned medal titles, or "" to wear none }
                goal: { type: string, enum: [zero, backend, interviews, ai], description: Onboarding goal }
                onboarded: { type: boolean, enum: [true], description: Marks onboarding finished (cannot be undone) }
      responses:
        "200":
          description: Updated user
          content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /home:
    get:
      operationId: getHome
      responses:
        "200":
          description: Continue card, today's goal and streak week, paths, league summary
          content: { application/json: { schema: { $ref: "#/components/schemas/Home" } } }
        "401": { $ref: "#/components/responses/Error" }
  /profile:
    get:
      operationId: getProfile
      responses:
        "200":
          description: The signed-in user's own profile (activity, projects, skills); never public
          content: { application/json: { schema: { $ref: "#/components/schemas/Profile" } } }
        "401": { $ref: "#/components/responses/Error" }
  /leagues/current:
    get:
      operationId: getCurrentLeague
      responses:
        "200":
          description: This week's league group (joined after the first XP of the week)
          content: { application/json: { schema: { $ref: "#/components/schemas/League" } } }
        "401": { $ref: "#/components/responses/Error" }
  /shop:
    get:
      operationId: getShop
      responses:
        "200": { description: Power-ups with the user's state, balance, effects, open bet, content: { application/json: { schema: { $ref: "#/components/schemas/Shop" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /inventory:
    get:
      operationId: getInventory
      responses:
        "200": { description: Same as /shop, content: { application/json: { schema: { $ref: "#/components/schemas/Shop" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /shop/{powerup}/buy:
    post:
      operationId: buyPowerup
      description: Spends Bytes, once per request_id (a replay returns the first response). 409 insufficient_bytes / limit_reached change nothing.
      parameters: [{ name: powerup, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RequestID" } } } }
      responses:
        "200": { description: Bought, content: { application/json: { schema: { $ref: "#/components/schemas/BuyResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /powerups/{powerup}/use:
    post:
      operationId: usePowerup
      description: Uses a held power-up (Streak Repair and Double or Nothing spend Bytes here), once per request_id.
      parameters: [{ name: powerup, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [request_id]
              additionalProperties: false
              properties:
                request_id: { type: string }
                exercise_id: { type: string, description: second_wind and peek }
                stake: { type: integer, description: "double_or_nothing: 100-500" }
      responses:
        "200": { description: Used, content: { application/json: { schema: { $ref: "#/components/schemas/UseResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /quests:
    get:
      operationId: getQuests
      responses:
        "200": { description: Today's quests, this week's quest and the daily chest, content: { application/json: { schema: { $ref: "#/components/schemas/Quests" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /quests/chest/open:
    post:
      operationId: openChest
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/RequestID" } } } }
      responses:
        "200": { description: The chest's contents (the same on every later call today), content: { application/json: { schema: { $ref: "#/components/schemas/ChestDrop" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /medals:
    get:
      operationId: getMedals
      responses:
        "200": { description: Medals with progress; unearned secret medals are masked, content: { application/json: { schema: { $ref: "#/components/schemas/Medals" } } } }
        "401": { $ref: "#/components/responses/Error" }
  /auth/providers:
    get:
      operationId: getAuthProviders
      responses:
        "200":
          description: Enabled sign-in methods
          content:
            application/json:
              schema:
                type: object
                required: [magic_link, github, dev]
                properties:
                  magic_link: { type: boolean }
                  github: { type: boolean }
                  dev: { type: boolean, description: DEV_AUTH (development only) }
  /auth/magic-link:
    post:
      operationId: sendMagicLink
      description: Emails a single-use sign-in link (15 minutes). Same answer whether or not the account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string }
                next: { type: string, description: Same-site path to open after sign-in }
      responses:
        "202": { description: Sent, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string } } } } } }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/magic-link/verify:
    post:
      operationId: verifyMagicLink
      description: Redeems the token from the link's URL fragment and sets the session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string }
                timezone: { type: string, description: The browser's IANA zone, saved on first sign-in }
      responses:
        "200":
          description: Signed in
          content: { application/json: { schema: { $ref: "#/components/schemas/SignedIn" } } }
        "400": { $ref: "#/components/responses/Error" }
  /auth/dev:
    post:
      operationId: devSignIn
      description: Development only (DEV_AUTH=1); 404 otherwise. Signs in without email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email: { type: string }
                name: { type: string }
                timezone: { type: string }
      responses:
        "200":
          description: Signed in
          content: { application/json: { schema: { $ref: "#/components/schemas/SignedIn" } } }
        "404": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      operationId: logout
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "204": { description: Signed out }
  /cli/codes:
    post:
      operationId: createCliCode
      description: >
        A one-time code for `codequest login`, for a user signed in with the session
        cookie (not a CLI token). Single use, expires after 10 minutes.
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "200":
          description: The code, formatted XXXXX-XXXXX
          content:
            application/json:
              schema:
                type: object
                required: [code, expires_at]
                properties:
                  code: { type: string }
                  expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Error" }
  /cli/token:
    post:
      operationId: createCliToken
      description: >
        Trades a login code for a CLI bearer token (90 days, extended on use). Exempt
        from the Origin check (it sets no cookie); still needs JSON. 20 attempts per IP per hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: Case and dashes are ignored }
                label: { type: string, description: e.g. the machine's hostname }
      responses:
        "200":
          description: The token, shown once
          content:
            application/json:
              schema:
                type: object
                required: [token, name, email]
                properties:
                  token: { type: string }
                  name: { type: string }
                  email: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /cli/logout:
    post:
      operationId: cliLogout
      description: Revokes the bearer token it is called with.
      security: [{ cliToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        "204": { description: Revoked }
        "401": { $ref: "#/components/responses/Error" }
  /cli/next:
    get:
      operationId: getCliNext
      description: The learner's first unpassed project_cli lesson in course order. Locks apply on GET /exercises/{id}.
      responses:
        "200":
          description: The next lesson
          content:
            application/json:
              schema:
                type: object
                required: [exercise_id, title, course_id, course_title, chapter_no, lesson_no]
                properties:
                  exercise_id: { type: string }
                  title: { type: string }
                  course_id: { type: string }
                  course_title: { type: string }
                  chapter_no: { type: integer, description: 1-based }
                  lesson_no: { type: integer, description: 1-based }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /auth/github/start:
    get:
      operationId: githubStart
      description: Redirects to GitHub (browser navigation, not fetch).
      parameters: [{ name: next, in: query, schema: { type: string } }]
      responses:
        "302": { description: Redirect to GitHub }
        "404": { $ref: "#/components/responses/Error" }
  /auth/github/callback:
    get:
      operationId: githubCallback
      responses:
        "302": { description: Redirect into the app (or /sign-in?error=github) }
  /courses:
    get:
      operationId: listCourses
      responses:
        "200":
          description: Published courses with the user's progress
          content:
            application/json:
              schema:
                type: object
                required: [courses, paths]
                properties:
                  courses: { type: array, items: { $ref: "#/components/schemas/CourseSummary" } }
                  paths: { type: array, items: { $ref: "#/components/schemas/CareerPath" } }
  /courses/{courseId}:
    get:
      operationId: getCourse
      parameters: [{ name: courseId, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Chapters and exercises in manifest order
          content: { application/json: { schema: { $ref: "#/components/schemas/CourseDetail" } } }
        "404": { $ref: "#/components/responses/Error" }
  /assets/{file}:
    get:
      operationId: getAsset
      description: >-
        A lesson image by content hash ("<sha256>.<ext>"), as listed in an exercise's `assets`.
        Public, immutable (cached for a year), served with nosniff and a sandbox CSP.
      parameters: [{ name: file, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{64}\\.(png|jpg|webp|gif|svg)$" } }]
      responses:
        "200":
          description: The image bytes
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/svg+xml: { schema: { type: string, format: binary } }
        "304": { description: Not modified (If-None-Match matched the ETag) }
        "404": { $ref: "#/components/responses/Error" }
  /exercises/{exerciseId}:
    get:
      operationId: getExercise
      parameters: [{ name: exerciseId, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Public view of the exercise and the learner's last submission
          content: { application/json: { schema: { $ref: "#/components/schemas/ExerciseDetail" } } }
        "402": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /exercises/{exerciseId}/submit:
    post:
      operationId: submitExercise
      parameters: [{ name: exerciseId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Submission" } } }
      responses:
        "200":
          description: Graded result
          content: { application/json: { schema: { $ref: "#/components/schemas/SubmitResponse" } } }
        "202":
          description: Still grading after 15 s; poll GET /submissions/{id}
          content: { application/json: { schema: { $ref: "#/components/schemas/PendingResponse" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /exercises/{exerciseId}/run:
    post:
      operationId: runExercise
      description: Ungraded server Run for exercises with run "server". Visible checks only; nothing is stored.
      parameters: [{ name: exerciseId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Submission" } } }
      responses:
        "200":
          description: Run output
          content: { application/json: { schema: { $ref: "#/components/schemas/RunOutput" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /submissions/{submissionId}:
    get:
      operationId: getSubmission
      parameters: [{ name: submissionId, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: One of the learner's own submissions; result is null while pending
          content: { application/json: { schema: { $ref: "#/components/schemas/SubmissionStatus" } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /exercises/{exerciseId}/tutor:
    get:
      operationId: getTutorThread
      description: The learner's tutor conversation for this exercise and today's hints left. 404 tutor_unavailable when the tutor is off (always in production for now).
      parameters: [{ name: exerciseId, in: path, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Conversation, oldest first
          content: { application/json: { schema: { $ref: "#/components/schemas/TutorThread" } } }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /exercises/{exerciseId}/hint:
    post:
      operationId: askTutor
      description: >-
        Ask the AI tutor. The reply streams as Server-Sent Events: `delta` {text} pieces, then `done` {remaining, used_hint}
        or `error` {code, message} (a failed reply refunds the hint). Errors before the stream (limit, validation) use the
        JSON envelope; `limit_reached` (429) when today's hints are used. Using a hint sets progress.used_hint.
      parameters: [{ name: exerciseId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message]
              properties:
                message: { type: string, maxLength: 2000 }
                code: { type: string, description: The learner's current answer (code or SQL) }
      responses:
        "200":
          description: Server-Sent Events stream
          content: { text/event-stream: { schema: { type: string } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /events:
    post:
      operationId: trackEvents
      description: Self-hosted product analytics. Only known event names; props are a flat object of at most 1 KB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [events]
              properties:
                anon_id: { type: string, pattern: "^[A-Za-z0-9-]{8,64}$" }
                events:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    additionalProperties: false
                    required: [name]
                    properties:
                      name:
                        type: string
                        enum: [page_view, landing_cta, sign_in, onboarding_step, onboarding_completed, lesson_opened, run_clicked, submit_clicked, tutor_opened, tutor_asked, shop_bought]
                      props: { type: object, additionalProperties: { oneOf: [{ type: string }, { type: number }, { type: boolean }] } }
                      path: { type: string }
                      at: { type: string, format: date-time }
      responses:
        "204": { description: Stored }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /client-errors:
    post:
      operationId: reportClientError
      description: A browser error for error monitoring; grouped by fingerprint per day and logged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message]
              properties:
                message: { type: string }
                stack: { type: string }
                url: { type: string }
                user_agent: { type: string }
                release: { type: string }
      responses:
        "204": { description: Recorded }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    cliToken:
      type: http
      scheme: bearer
      description: >
        The `codequest` CLI's token. Accepted on every endpoint in place of the
        cq_session cookie (never together with it); such requests skip the Origin check.
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, description: "e.g. not_found, bad_request, invalid_answer, stale_version, run_unavailable, rate_limited, grader_unavailable, locked, unauthorized" }
            message: { type: string }
    User:
      type: object
      required: [id, email, name, avatar, timezone, goal, onboarded]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        avatar: { type: string }
        timezone: { type: string }
        goal: { type: string, enum: ["", zero, backend, interviews, ai] }
        onboarded: { type: boolean }
    Me:
      type: object
      required: [user, stats, features]
      properties:
        user: { $ref: "#/components/schemas/User" }
        stats: { $ref: "#/components/schemas/Stats" }
        features: { $ref: "#/components/schemas/Features" }
    Features:
      type: object
      required: [tutor]
      properties:
        tutor: { type: boolean, description: The AI tutor is on (development only for now) }
    TutorMessage:
      type: object
      required: [role, content, created_at]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        created_at: { type: string, format: date-time }
    TutorThread:
      type: object
      required: [daily_limit, remaining, messages]
      properties:
        daily_limit: { type: integer }
        remaining: { type: integer }
        messages: { type: array, items: { $ref: "#/components/schemas/TutorMessage" } }
    SignedIn:
      type: object
      required: [user, next]
      properties:
        user: { $ref: "#/components/schemas/User" }
        next: { type: string }
    Tier:
      type: string
      enum: [bronze, silver, gold, diamond]
    Stats:
      type: object
      required: [total_xp, level, level_start_xp, next_level_xp, streak_days, streak_freezes, league_tier, daily_goal, today_lessons, bytes, title, longest_streak]
      properties:
        total_xp: { type: integer }
        level: { type: integer }
        level_start_xp: { type: integer, description: Cumulative XP where this level began }
        next_level_xp: { type: integer, description: Cumulative XP for the next level }
        streak_days: { type: integer, description: "Current streak (0 when missed days exceed freezes)" }
        streak_freezes: { type: integer }
        league_tier: { $ref: "#/components/schemas/Tier" }
        daily_goal: { type: integer }
        today_lessons: { type: integer }
        bytes: { type: integer }
        title: { type: string }
        longest_streak: { type: integer }
    Breakdown:
      type: object
      required: [base, first_try, no_hint, boss, boost]
      properties:
        base: { type: integer }
        first_try: { type: integer }
        no_hint: { type: integer }
        boss: { type: integer }
        boost: { type: integer, description: Focus Boost (doubles the rest) }
    Outcome:
      type: object
      description: What a graded submission did to the user's game state.
      required: [xp_awarded, breakdown, first_try, second_wind_kept, focus_boost, total_xp, level, level_up, level_start_xp, next_level_xp, streak_days, streak_extended, freezes_used, freeze_earned, rewards]
      properties:
        xp_awarded: { type: integer }
        breakdown:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Breakdown"
        first_try: { type: boolean }
        total_xp: { type: integer }
        level: { type: integer }
        level_up: { type: boolean }
        level_start_xp: { type: integer }
        next_level_xp: { type: integer }
        streak_days: { type: integer }
        streak_extended: { type: boolean }
        freezes_used: { type: integer }
        freeze_earned: { type: boolean }
        second_wind_kept: { type: boolean }
        focus_boost: { type: boolean }
        rewards:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Rewards"
    Rewards:
      type: object
      required: [bytes, medals, quests_done, chest_ready, chapter_complete, boss]
      properties:
        bytes:
          type: array
          items: { type: object, required: [reason, label, amount], properties: { reason: { type: string }, label: { type: string }, amount: { type: integer } } }
        medals:
          type: array
          items: { type: object, required: [id, name, tier, title], properties: { id: { type: string }, name: { type: string }, tier: { type: string }, title: { type: string } } }
        quests_done: { type: array, items: { type: string } }
        chest_ready: { type: boolean }
        chapter_complete: { type: boolean }
        boss:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/BossResult"
    BossResult:
      type: object
      required: [max_hp, hp, defeated, chest, unlocked_chapter]
      properties:
        max_hp: { type: integer }
        hp: { type: integer }
        defeated: { type: boolean }
        chest:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ChestDrop"
        unlocked_chapter: { type: string }
    ChestDrop:
      type: object
      required: [bytes, powerup]
      properties:
        bytes: { type: integer }
        powerup: { type: string }
    RequestID:
      type: object
      required: [request_id]
      additionalProperties: false
      properties:
        request_id: { type: string, maxLength: 64 }
    ShopItem:
      type: object
      required: [id, name, description, note, cost, owned, state, use, usable_now]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        note: { type: string }
        cost: { type: integer }
        unavailable: { type: string }
        owned: { type: integer }
        state: { type: string, enum: [buy, max_held, streak_safe, repair, pro, coming_soon, bet_open, place_bet] }
        use: { type: string, enum: [auto, now, lessons, ""] }
        usable_now: { type: boolean }
    Bet:
      type: object
      required: [stake, goal, starts_on, days_met]
      properties:
        stake: { type: integer }
        goal: { type: integer }
        starts_on: { type: string, format: date }
        days_met: { type: integer }
    Shop:
      type: object
      required: [balance, earned_today, items, effects, bet, earn]
      properties:
        balance: { type: integer }
        earned_today: { type: integer }
        items: { type: array, items: { $ref: "#/components/schemas/ShopItem" } }
        effects:
          type: array
          items: { type: object, required: [effect, ref_id, expires_at], properties: { effect: { type: string }, ref_id: { type: string }, expires_at: { type: string, format: date-time } } }
        bet:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Bet"
        earn:
          type: array
          items: { type: object, required: [label, amount], properties: { label: { type: string }, amount: { type: string } } }
    BuyResult:
      type: object
      required: [powerup, owned, balance]
      properties:
        powerup: { type: string }
        owned: { type: integer }
        balance: { type: integer }
    UseResult:
      type: object
      required: [powerup, remaining, balance]
      properties:
        powerup: { type: string }
        remaining: { type: integer }
        expires_at: { type: string, format: date-time }
        peek:
          type: object
          required: [check, name, input]
          description: The declared input of one failed hidden check. Never its expected output.
          properties:
            check: { type: integer }
            name: { type: string }
            input: { type: string }
        bet: { $ref: "#/components/schemas/Bet" }
        streak: { type: integer }
        balance: { type: integer }
    Quest:
      type: object
      required: [id, cadence, name, event, target, bytes, progress, done]
      properties:
        id: { type: string }
        cadence: { type: string, enum: [daily, weekly] }
        name: { type: string }
        event: { type: string }
        target: { type: integer }
        bytes: { type: integer }
        progress: { type: integer }
        done: { type: boolean }
    Quests:
      type: object
      required: [daily, weekly, resets_at, chest]
      properties:
        daily: { type: array, items: { $ref: "#/components/schemas/Quest" } }
        weekly: { $ref: "#/components/schemas/Quest" }
        resets_at: { type: string, format: date-time }
        chest:
          type: object
          required: [ready, opened, odds, bytes]
          properties:
            ready: { type: boolean }
            opened:
              oneOf:
                - type: "null"
                - $ref: "#/components/schemas/ChestDrop"
            odds:
              type: array
              items: { type: object, required: [powerup, weight], properties: { powerup: { type: string }, weight: { type: integer } } }
            bytes: { type: array, items: { type: integer }, minItems: 2, maxItems: 2 }
    MedalTier:
      type: object
      required: [tier, gte, title, bytes, earned_at]
      properties:
        tier: { type: string }
        gte: { type: integer }
        title: { type: string }
        bytes: { type: integer }
        earned_at: { oneOf: [{ type: "null" }, { type: string, format: date-time }] }
    Medal:
      type: object
      required: [id, family, name, description, unit, secret, coming_soon, value, tier, next_tier, next_gte, tiers]
      properties:
        id: { type: string }
        family: { type: string }
        name: { type: string }
        description: { type: string }
        unit: { type: string }
        secret: { type: boolean }
        coming_soon: { type: boolean }
        value: { type: integer }
        tier: { type: string }
        next_tier: { type: string }
        next_gte: { type: integer }
        tiers: { type: array, items: { $ref: "#/components/schemas/MedalTier" } }
    Medals:
      type: object
      required: [earned, total, medals, families, titles, title]
      properties:
        earned: { type: integer }
        total: { type: integer }
        medals: { type: array, items: { $ref: "#/components/schemas/Medal" } }
        families:
          type: array
          items: { type: object, required: [id, name], properties: { id: { type: string }, name: { type: string } } }
        titles: { type: array, items: { type: string } }
        title: { type: string }
    CodeLine:
      type: object
      required: [n, text]
      properties:
        n: { type: integer }
        text: { type: string }
    LastAttempt:
      type: object
      required: [status, passed, total, file, lines, error_line]
      properties:
        status: { type: string }
        passed: { type: integer }
        total: { type: integer }
        file: { type: string }
        lines: { type: array, items: { $ref: "#/components/schemas/CodeLine" } }
        error_line: { type: integer }
    ContinueCard:
      type: object
      required: [course_id, course_title, chapter_title, chapter_index, exercise_id, exercise_title, exercise_type, position, lessons, last]
      properties:
        course_id: { type: string }
        course_title: { type: string }
        chapter_title: { type: string }
        chapter_index: { type: integer }
        exercise_id: { type: string }
        exercise_title: { type: string }
        exercise_type: { type: string }
        position:
          type: object
          required: [index, total]
          properties: { index: { type: integer }, total: { type: integer } }
        lessons: { type: array, items: { $ref: "#/components/schemas/ProgressStatus" } }
        last:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/LastAttempt"
    DayCell:
      type: object
      required: [date, active, today]
      properties:
        date: { type: string, format: date }
        active: { type: boolean }
        today: { type: boolean }
    LeagueSummary:
      type: object
      required: [joined, tier, rank, of, weekly_xp, ends_at, promote, demote, xp_to_promote, zone]
      properties:
        joined: { type: boolean }
        tier: { $ref: "#/components/schemas/Tier" }
        rank: { type: integer }
        of: { type: integer }
        weekly_xp: { type: integer }
        ends_at: { type: string, format: date-time }
        promote: { type: integer }
        demote: { type: integer }
        xp_to_promote: { type: integer }
        zone: { $ref: "#/components/schemas/LeagueZone" }
    LeagueZone:
      type: string
      enum: [promote, stay, demote]
    League:
      allOf:
        - $ref: "#/components/schemas/LeagueSummary"
        - type: object
          required: [standings]
          properties:
            standings:
              type: array
              items:
                type: object
                required: [rank, name, title, weekly_xp, you, zone]
                properties:
                  rank: { type: integer }
                  name: { type: string }
                  title: { type: string }
                  weekly_xp: { type: integer }
                  you: { type: boolean }
                  zone: { $ref: "#/components/schemas/LeagueZone" }
    Activity:
      type: object
      description: Lessons passed per local day over the last 53 weeks; only days with a pass are listed
      required: [from, to, days, longest_streak]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date, description: The user's local today }
        longest_streak: { type: integer }
        days:
          type: array
          items:
            type: object
            required: [date, lessons]
            properties:
              date: { type: string, format: date }
              lessons: { type: integer }
    CareerPath:
      type: object
      required: [id, title, description, yours, steps, exercise_count, passed_count]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        yours: { type: boolean, description: The path matches the user's onboarding goal }
        exercise_count: { type: integer }
        passed_count: { type: integer }
        steps:
          type: array
          items:
            type: object
            required: [course_id, title, note, status]
            properties:
              course_id: { type: string }
              title: { type: string }
              note: { type: string }
              status: { $ref: "#/components/schemas/CourseStatus" }
    CourseStatus:
      type: string
      enum: [not_started, in_progress, done]
    Project:
      type: object
      description: A chapter boss
      required: [exercise_id, course_id, course_title, title, chapter_index, chapter_title, status, first_try, defeated_at]
      properties:
        exercise_id: { type: string }
        course_id: { type: string }
        course_title: { type: string }
        title: { type: string }
        chapter_index: { type: integer }
        chapter_title: { type: string }
        status: { type: string, enum: [defeated, next, upcoming] }
        first_try: { type: boolean }
        defeated_at: { oneOf: [{ type: "null" }, { type: string, format: date-time }] }
    Profile:
      type: object
      required: [joined_at, path, projects_shipped, activity, projects, skills, recent]
      properties:
        joined_at: { type: string, format: date-time }
        path:
          oneOf:
            - type: "null"
            - type: object
              required: [id, title]
              properties: { id: { type: string }, title: { type: string } }
        projects_shipped: { type: integer }
        activity: { $ref: "#/components/schemas/Activity" }
        projects: { type: array, items: { $ref: "#/components/schemas/Project" } }
        skills:
          oneOf:
            - type: "null"
            - type: object
              required: [course_id, course_title, chapters]
              properties:
                course_id: { type: string }
                course_title: { type: string }
                chapters:
                  type: array
                  items:
                    type: object
                    required: [title, tier, passed, lessons]
                    properties:
                      title: { type: string }
                      tier: { type: string, enum: ["", bronze, silver, gold] }
                      passed: { type: integer }
                      lessons: { type: integer }
        recent:
          type: array
          items:
            type: object
            required: [date, exercise_id, title, boss, course_id, course_title]
            properties:
              date: { type: string, format: date }
              exercise_id: { type: string }
              title: { type: string }
              boss: { type: boolean }
              course_id: { type: string }
              course_title: { type: string }
    Home:
      type: object
      required: [continue, today, paths, league, activity]
      properties:
        activity: { $ref: "#/components/schemas/Activity" }
        continue:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ContinueCard"
        today:
          type: object
          required: [goal, done, streak_days, week]
          properties:
            goal: { type: integer }
            done: { type: integer }
            streak_days: { type: integer }
            week: { type: array, items: { $ref: "#/components/schemas/DayCell" } }
        paths:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/CourseSummary"
              - type: object
                required: [next_boss, up_next, after]
                properties:
                  next_boss: { type: [string, "null"], description: Title of the course's first undefeated boss }
                  up_next: { type: boolean, description: The next course on the user's career path, not started yet }
                  after: { type: string, description: The course before it on the path ("" for the first) }
        league: { $ref: "#/components/schemas/LeagueSummary" }
    CourseSummary:
      type: object
      required: [id, title, description, icon, level, tags, topics, runs, chapter_count, exercise_count, passed_count, chapters_done, free_count, status, current_chapter]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        icon: { type: string, description: 1-4 lowercase characters for the course tile }
        level: { type: string, enum: [beginner, intermediate, advanced] }
        tags: { type: array, items: { type: string }, description: Catalog filters }
        topics: { type: string }
        runs: { type: array, items: { type: string, enum: [browser, cli] } }
        chapter_count: { type: integer }
        exercise_count: { type: integer }
        passed_count: { type: integer }
        chapters_done: { type: integer }
        free_count: { type: integer, description: Free lessons; 0 means the course needs Pro }
        status: { $ref: "#/components/schemas/CourseStatus" }
        current_chapter:
          description: Chapter of the first unpassed lesson, while in progress
          oneOf:
            - type: "null"
            - type: object
              required: [index, title]
              properties: { index: { type: integer }, title: { type: string } }
    ProgressStatus:
      type: string
      enum: [not_started, started, passed]
    ExerciseSummary:
      type: object
      required: [id, title, type, xp, difficulty, free, boss, status]
      properties:
        id: { type: string }
        title: { type: string }
        type: { type: string }
        xp: { type: integer }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        free: { type: boolean }
        boss: { type: boolean }
        status: { $ref: "#/components/schemas/ProgressStatus" }
    CourseDetail:
      type: object
      required: [id, title, description, chapters, skills, xp_earned, xp_total]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        skills: { type: array, items: { type: string }, description: Distinct lesson tags in course order }
        xp_earned: { type: integer }
        xp_total: { type: integer, description: Base XP of all lessons (bonuses not included) }
        chapters:
          type: array
          items:
            type: object
            required: [id, title, locked, exercises]
            properties:
              id: { type: string }
              title: { type: string }
              locked: { type: boolean, description: Behind an earlier chapter's undefeated boss (lessons answer 403 chapter_locked) }
              exercises: { type: array, items: { $ref: "#/components/schemas/ExerciseSummary" } }
    Result:
      type: object
      required: [status, score, checks, stdout, runtime_ms]
      properties:
        status: { type: string, enum: [pass, fail, error, timeout] }
        score: { type: number, minimum: 0, maximum: 1 }
        checks: { type: array, items: { $ref: "#/components/schemas/CheckResult" } }
        stdout: { type: string }
        runtime_ms: { type: integer }
    CheckResult:
      type: object
      required: [name, passed, visible]
      properties:
        name: { type: string }
        passed: { type: boolean }
        visible: { type: boolean }
        feedback: { type: string }
        got: { type: string, description: Short repr of the learner's value; failed visible checks only }
        expected: { type: string, description: Short repr of the expected value; failed visible checks only }
        line: { type: integer, description: 1-based line in the learner's file the failure points at }
    ExerciseDetail:
      type: object
      required: [id, type, version, title, xp, difficulty, tags, free, boss, course_id, chapter, position, prev_id, next_id, public_view, assets, last_submission]
      properties:
        id: { type: string }
        type: { type: string }
        version: { type: integer }
        title: { type: string }
        xp: { type: integer }
        difficulty: { type: integer }
        tags: { type: array, items: { type: string } }
        free: { type: boolean }
        boss: { type: boolean }
        course_id: { type: string }
        chapter:
          type: object
          required: [id, title]
          properties: { id: { type: string }, title: { type: string } }
        position:
          type: object
          required: [index, total]
          properties: { index: { type: integer }, total: { type: integer } }
        prev_id: { type: [string, "null"] }
        next_id: { type: [string, "null"] }
        public_view: { description: Type-specific public view (see the exercise type's renderer) }
        assets:
          description: Lesson images, from the name used in the content ("assets/loop.svg") to its URL
          type: object
          additionalProperties: { type: string }
        last_submission:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/LastSubmission"
    LastSubmission:
      type: object
      required: [submission_id, exercise_version, answer, result, created_at]
      properties:
        submission_id: { type: string, format: uuid }
        exercise_version: { type: integer }
        answer: { description: The learner's own answer, type-specific }
        result:
          description: Null while the submission is still being graded
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Result"
        created_at: { type: string, format: date-time }
    Submission:
      type: object
      required: [exercise_id, version, answer]
      additionalProperties: false
      properties:
        exercise_id: { type: string }
        version: { type: integer }
        answer: { description: "Type-specific answer, e.g. mcq { choices: string[] }" }
    SubmitResponse:
      type: object
      required: [submission_id, result, xp_awarded, outcome]
      properties:
        submission_id: { type: string, format: uuid }
        result: { $ref: "#/components/schemas/Result" }
        xp_awarded: { type: integer }
        outcome: { $ref: "#/components/schemas/Outcome" }
    PendingResponse:
      type: object
      required: [submission_id, status]
      properties:
        submission_id: { type: string, format: uuid }
        status: { type: string, enum: [pending] }
    SubmissionStatus:
      type: object
      required: [submission_id, exercise_id, exercise_version, status, result, xp_awarded, outcome, created_at]
      properties:
        submission_id: { type: string, format: uuid }
        exercise_id: { type: string }
        exercise_version: { type: integer }
        status: { type: string, enum: [pending, pass, fail, error, timeout] }
        result:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Result"
        xp_awarded: { type: integer }
        outcome:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/Outcome"
        created_at: { type: string, format: date-time }
    Table:
      type: object
      required: [columns, rows, truncated]
      properties:
        columns: { type: array, items: { type: string } }
        rows: { type: array, items: { type: array, items: { type: [string, number, "null"] } } }
        truncated: { type: boolean }
    RunOutput:
      type: object
      required: [stdout, stderr, checks, runtime_ms, timed_out]
      properties:
        stdout: { type: string }
        stderr: { type: string }
        checks: { type: array, items: { $ref: "#/components/schemas/CheckResult" } }
        runtime_ms: { type: integer }
        timed_out: { type: boolean }
        table: { $ref: "#/components/schemas/Table" }
        error: { type: string }
