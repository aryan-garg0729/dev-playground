id: demo.basics.sum
type: code
version: 1
title: Sum a list
xp: 20
difficulty: 2
tags: [loops]
boss: true
spec:
  language: python
  runner: pyodide
  prompt: prompt.md
  entry: main.py
  starter: starter.py
  solution: solution.py
  limits: { timeout_ms: 2000, memory_mb: 128 }
