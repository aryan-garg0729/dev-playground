# Render blueprint (free plan): one web service (API + built web app on one
# origin) and a free Key Value (Redis) instance. Postgres is external (Neon's
# free plan does not expire; Render's free Postgres is deleted after 30 days).
# Values marked sync: false are asked for when the blueprint is created.
# See docs/DEPLOY.md.
services:
  - type: web
    name: codequest
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/healthz
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: HTTP_ADDR
        value: ":10000"
      - key: APP_URL # https://<service>.onrender.com, no trailing slash
        sync: false
      - key: ALLOWED_ORIGINS # the same value as APP_URL
        sync: false
      - key: DATABASE_URL # Neon connection string (sslmode=require)
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: codequest-redis
          property: connectionString
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

  - type: keyvalue
    name: codequest-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: [] # reachable only from services in this Render account
